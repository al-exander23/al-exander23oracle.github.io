name: ALX live 299 check

on:
  push:
    paths:
      - '.github/workflows/alx-live-299-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live price restored
        shell: bash
        run: |
          set -euo pipefail
          URL='https://alx-pay.alxoracle.workers.dev/api/config'
          ok=0
          for i in {1..24}; do
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$URL" || true)
            if [ "$code" = '200' ] && grep -qi '^x-alx-payment-mode: live' "$headers" && grep -qi '^x-alx-live-ready: yes' "$headers"; then
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); o=d.get('offer') or {}; assert d.get('ok') is True; assert o.get('priceRub') == 299; assert o.get('enabled') is True; assert o.get('periodDays') == 30" "$body" && ok=1 && break
            fi
            sleep 10
          done
          test "$ok" = '1'
          echo 'PASS: ALX Pay live price restored to 299 RUB'
