name: ALX current guide smoke

on:
  push:
    paths:
      - '.github/workflows/alx-guide-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for live guide assets
        run: |
          set -e
          for i in $(seq 1 36); do
            HTML=$(curl -fsSL 'https://al-exander23.github.io/al-exander23oracle.github.io/?guide-smoke=1' || true)
            if echo "$HTML" | grep -q 'onboarding.js?v=1.27.0-current-guide' && echo "$HTML" | grep -q 'navigation.js?v=1.27.0-current-guide'; then
              echo 'Guide assets are live'
              exit 0
            fi
            echo "waiting for Pages deploy: $i"
            sleep 5
          done
          exit 1

      - name: Prepare Playwright
        run: |
          mkdir -p /tmp/alx-guide-smoke && cd /tmp/alx-guide-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify onboarding and manual help
        working-directory: /tmp/alx-guide-smoke
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const APP='https://al-exander23.github.io/al-exander23oracle.github.io/?guide-smoke=v127';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          await context.addInitScript(()=>{
            localStorage.removeItem('alx_oracle_onboarding_v1');
            localStorage.removeItem('alx_oracle_history');
            localStorage.removeItem('alx_oracle_pro_entitlement');
          });
          const page=await context.newPage();
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.route('**/*',async route=>{
            const url=route.request().url();
            if(url.includes('fonts.googleapis.com')||url.includes('fonts.gstatic.com')||url.includes('telegram.org/js/telegram-web-app.js')) return route.abort();
            return route.continue();
          });
          await page.goto(APP,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForFunction(()=>document.querySelector('#alxOnboarding')?.classList.contains('show'),null,{timeout:15000});
          let title=await page.locator('#alxTourTitle').textContent();
          if(!title?.includes('Оракул, а не каталог')) throw new Error('Wrong first step: '+title);
          const stepTexts=[];
          for(let i=0;i<6;i++){
            stepTexts.push(await page.locator('#alxTourText').textContent());
            await page.click('#alxTourNext');
          }
          const finalText=await page.locator('#alxTourText').textContent();
          const allText=stepTexts.join(' ')+' '+finalText;
          for(const phrase of ['FREE даёт 5 подборов','ALX Originals','Parfum Lab','выбери направление']){
            if(!allText.includes(phrase)) throw new Error('Guide missing phrase: '+phrase);
          }
          await page.click('#alxTourNext');
          await page.waitForFunction(()=>!document.querySelector('#alxOnboarding')?.classList.contains('show'),null,{timeout:5000});
          const done=await page.evaluate(()=>localStorage.getItem('alx_oracle_onboarding_v1'));
          if(done!=='done') throw new Error('Guide completion was not stored');

          await page.click('#alxBottomNav [data-tab="account"]');
          await page.waitForSelector('#myAlxHelp',{timeout:10000});
          const helpText=await page.locator('#myAlxHelp').textContent();
          if(!helpText?.includes('FREE/PRO')||!helpText?.includes('направления')) throw new Error('My ALX help copy is stale: '+helpText);
          await page.click('#myAlxHelp');
          await page.waitForFunction(()=>document.querySelector('#alxOnboarding')?.classList.contains('show'),null,{timeout:10000});
          title=await page.locator('#alxTourTitle').textContent();
          if(!title?.includes('Оракул, а не каталог')) throw new Error('Manual help did not open updated guide');
          await page.click('#alxTourSkip');
          await page.waitForFunction(()=>!document.querySelector('#alxOnboarding')?.classList.contains('show'),null,{timeout:5000});

          await page.click('#orbWrap');
          await page.waitForFunction(()=>/^№\s*\d+/.test(document.querySelector('#counter')?.textContent||''),null,{timeout:25000});
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          console.log('PASS: updated onboarding + My ALX help + orb interaction.');
          await browser.close();
          JS
          node smoke.mjs
