name: ALX Originals Security Smoke

on:
  push:
    paths:
      - '.github/workflows/originals-security-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify D1, auth gate and public source
        run: |
          set -euo pipefail

          HEALTH=$(curl -fsS 'https://alx-pay.alxoracle.workers.dev/api/originals/health')
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"storage":"d1"'
          echo "$HEALTH" | grep -q '"total":5'
          echo "$HEALTH" | grep -q '"active":5'

          CF_BODY=$(mktemp)
          CF_CODE=$(curl -sS -o "$CF_BODY" -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{}' \
            'https://alx-pay.alxoracle.workers.dev/api/originals')
          echo "Cloudflare unauthenticated status: $CF_CODE"
          cat "$CF_BODY"
          test "$CF_CODE" = '401'
          ! grep -q '"mixes"' "$CF_BODY"

          V_BODY=$(mktemp)
          V_CODE=$(curl -sS -o "$V_BODY" -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{}' \
            'https://al-exander23oracle-github-io.vercel.app/api/originals')
          echo "Vercel compatibility endpoint status: $V_CODE"
          cat "$V_BODY"
          test "$V_CODE" = '401'
          ! grep -q '"mixes"' "$V_BODY"

          SOURCE=$(curl -fsS 'https://raw.githubusercontent.com/al-exander23/al-exander23oracle.github.io/main/api/originals.js')
          ! echo "$SOURCE" | grep -q 'Bazar Night'
          ! echo "$SOURCE" | grep -q 'Luxury Viski-Cola'
          ! echo "$SOURCE" | grep -q 'Мускус тайм'

          echo 'PASS: Originals are D1-backed, unauthenticated requests are denied, current public API source contains no recipes.'
