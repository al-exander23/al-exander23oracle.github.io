name: Check white-label build

on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'cloudflare/**'
      - 'data/tenants.json'
      - 'data/tenant-mixes.json'
      - 'scripts/**'
      - 'wrangler.toml'
      - '.github/workflows/check-white-label.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate venue configuration
        run: node scripts/validate-venue-config.mjs

      - name: Parse changed JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          files=(
            js/tenant.js
            js/scenario.js
            js/ui.js
            js/mixes.js
            js/scene.js
            js/app.js
            js/storage.js
            js/pro-entry.js
            js/pro-ui.js
            js/navigation.js
            js/my-alx.js
            js/taste.js
            js/scenario-ui.js
            js/home-direction.js
            js/community.js
            js/analytics.js
            js/onboarding.js
            js/venue-features.js
            cloudflare/analytics.js
            cloudflare/community.js
            cloudflare/worker-v2.js
            scripts/add-tenant.mjs
          )
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

      - name: Check Oracle module version alignment
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "mixes.js?v=1.33.0-payment-audit\|scenario.js?v=1.33.0-payment-audit" js/oracle.js; then
            echo "oracle.js is importing stale module URLs and would create a second ESM cache instance"
            exit 1
          fi

      - name: Test tenant onboarding helper
        shell: bash
        run: |
          set -euo pipefail
          cp data/tenants.json /tmp/tenants.json
          node scripts/add-tenant.mjs ci-lounge "CI Lounge" ci_lounge_bot "" "@ci_lounge" "" "" --plan=business
          node -e "const t=JSON.parse(require('fs').readFileSync('data/tenants.json','utf8')); if(t['ci-lounge']?.plan !== 'business') process.exit(1);"
          mv /tmp/tenants.json data/tenants.json
          node scripts/validate-venue-config.mjs
