name: ALX payment result check

on:
  push:
    paths:
      - '.github/workflows/alx-payment-result-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest payment and entitlement
        shell: bash
        run: |
          set -euo pipefail
          URL='https://alx-pay.alxoracle.workers.dev/api/_payment-smoke'
          ok=0
          for i in {1..24}; do
            code=$(curl -sS -o /tmp/result.json -w '%{http_code}' "$URL" || true)
            cat /tmp/result.json 2>/dev/null || true; echo
            if [ "$code" = '200' ] && python3 - <<'PY'
          import json
          with open('/tmp/result.json', encoding='utf-8') as f:
              d=json.load(f)
          p=d.get('latestPayment') or {}
          e=d.get('latestEntitlement') or {}
          assert d.get('ok') is True
          assert p.get('succeeded') is True
          assert p.get('amountRub') == 1
          assert p.get('ageSeconds', 999999) < 3600
          assert e.get('active') is True
          assert e.get('source') == 'yookassa'
          assert e.get('ageSeconds', 999999) < 3600
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = '1'
          echo 'PASS: latest 1 RUB YooKassa payment succeeded and active PRO entitlement exists'
