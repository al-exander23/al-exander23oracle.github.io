name: ALX live UI smoke check

on:
  push:
    paths:
      - '.github/workflows/alx-ui-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare Playwright
        run: |
          mkdir -p /tmp/alx-smoke && cd /tmp/alx-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify live ALX Oracle interactions
        working-directory: /tmp/alx-smoke
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));

          await page.route('**/*', async route => {
            const url = route.request().url();
            if (url.includes('fonts.googleapis.com') || url.includes('fonts.gstatic.com') || url.includes('telegram.org/js/telegram-web-app.js')) {
              return route.abort();
            }
            return route.continue();
          });

          await page.goto('https://al-exander23.github.io/al-exander23oracle.github.io/?smoke=1221c', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForSelector('#orbWrap', { state: 'visible', timeout: 15000 });
          await page.waitForSelector('#alxBottomNav', { state: 'visible', timeout: 15000 });

          await page.click('#orbWrap');
          await page.waitForFunction(() => /^№\s*\d+/.test(document.querySelector('#counter')?.textContent || ''), null, { timeout: 25000 });

          const onboarding = page.locator('#alxOnboarding.show');
          if (await onboarding.count()) {
            await page.click('#alxTourSkip');
            await page.waitForFunction(() => !document.querySelector('#alxOnboarding')?.classList.contains('show'), null, { timeout: 5000 });
          }

          await page.click('#alxBottomNav [data-tab="favorites"]');
          await page.waitForFunction(() => document.querySelector('#sheetOverlay')?.classList.contains('show'), null, { timeout: 5000 });
          await page.click('#sheetClose');

          await page.click('#alxBottomNav [data-tab="account"]');
          await page.waitForFunction(() => document.querySelector('#myAlxOverlay')?.classList.contains('show'), null, { timeout: 5000 });
          await page.click('#myAlxClose');

          await page.click('#alxBottomNav [data-tab="pro"]');
          await page.waitForFunction(() => document.querySelector('#alxProOverlay')?.classList.contains('show'), null, { timeout: 5000 });

          if (errors.length) {
            console.log('Page errors:', errors);
            throw new Error(`Browser page errors detected: ${errors.join(' | ')}`);
          }
          console.log('PASS: orb + Favorites + My ALX + PRO are interactive.');
          await browser.close();
          JS
          node smoke.mjs
