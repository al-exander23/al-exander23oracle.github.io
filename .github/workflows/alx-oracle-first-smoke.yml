name: ALX Oracle-first PRO smoke

on:
  push:
    paths:
      - '.github/workflows/alx-oracle-first-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for live Oracle-first assets
        run: |
          set -e
          for i in $(seq 1 36); do
            HTML=$(curl -fsSL 'https://al-exander23.github.io/al-exander23oracle.github.io/?oracle-first-smoke=1' || true)
            if echo "$HTML" | grep -q 'originals-nav-hook.js?v=1.26.0-oracle-first' && ! echo "$HTML" | grep -q 'originals-catalog.css'; then
              echo 'Oracle-first assets are live'
              exit 0
            fi
            echo "waiting for Pages deploy: $i"
            sleep 5
          done
          exit 1

      - name: Prepare Playwright
        run: |
          mkdir -p /tmp/alx-oracle-first && cd /tmp/alx-oracle-first
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify FREE and PRO direction flows
        working-directory: /tmp/alx-oracle-first
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const APP = 'https://al-exander23.github.io/al-exander23oracle.github.io/?oracle-first=v126';
          const browser = await chromium.launch({ headless:true });
          const labels = ['ALX Originals','Parfum Lab','LIMITED 2026','ALX Signature','Для двоих','После полуночи','Эксперимент'];

          async function optionalRoutes(page) {
            await page.route('**/*', async route => {
              const url = route.request().url();
              if (url.includes('fonts.googleapis.com') || url.includes('fonts.gstatic.com') || url.includes('telegram.org/js/telegram-web-app.js')) return route.abort();
              return route.continue();
            });
          }

          // FREE: all directions visible, recipes not browseable, selection opens paywall.
          {
            const context = await browser.newContext({ viewport:{width:390,height:844} });
            await context.addInitScript(() => {
              localStorage.setItem('alx_oracle_onboarding_v1','done');
              localStorage.removeItem('alx_oracle_pro_entitlement');
            });
            const page = await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await optionalRoutes(page);
            await page.goto(APP+'&free=1',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('#alxBottomNav [data-tab="pro"]',{timeout:15000});
            await page.click('#alxBottomNav [data-tab="pro"]');
            await page.waitForFunction(()=>document.querySelector('#alxProLibrary')?.classList.contains('show'),null,{timeout:10000});
            if (await page.locator('#alxProLibrary [data-pro-card]').count() !== 7) throw new Error('Expected 7 PRO directions');
            const text = await page.locator('#alxProLibraryContent').textContent();
            for (const label of labels) if (!text?.includes(label)) throw new Error('Missing direction '+label);
            if (text?.includes('Открыть каталог')) throw new Error('Browseable Originals catalog still exposed');
            if (await page.locator('#alxOriginalsCatalog').count()) throw new Error('Legacy Originals catalog exists in DOM');
            await page.click('[data-pro-select="originals"]');
            await page.waitForFunction(()=>document.querySelector('#alxProOverlay')?.classList.contains('show'),null,{timeout:10000});
            if (errors.length) throw new Error(errors.join(' | '));
            await context.close();
          }

          // PRO: choose Originals direction, then the orb reveals one of its mixes.
          {
            const context = await browser.newContext({ viewport:{width:390,height:844} });
            await context.addInitScript(() => {
              localStorage.setItem('alx_oracle_onboarding_v1','done');
              localStorage.setItem('alx_oracle_pro_entitlement',JSON.stringify({plan:'pro',status:'active',expiresAt:Date.now()+86400000,source:'smoke'}));
              window.Telegram={WebApp:{initData:'mock-init',platform:'android'}};
            });
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await optionalRoutes(page);
            const mixes=[
              {id:'alx-original-001',name:'Bazar Night',recipe:[{flavor:'Пан-расс',percent:10},{flavor:'Блэк Афгано',percent:30},{flavor:'Индийский перец',percent:10},{flavor:'Чернослив',percent:50}],author:'ALX Originals',proOnly:true,hiddenUntilPro:true,exclusiveCollection:'originals',collections:['originals'],original:true},
              {id:'alx-original-002',name:'Дорогая вишня',recipe:[{flavor:'Бакара Руж',percent:80},{flavor:'Вишня',percent:20}],author:'ALX Originals',proOnly:true,hiddenUntilPro:true,exclusiveCollection:'originals',collections:['originals'],original:true},
              {id:'alx-original-003',name:'Мускус тайм',recipe:[{flavor:'Мускусная вишня',percent:60},{flavor:'Пан-расс',percent:20},{flavor:'Черешня',percent:20}],author:'ALX Originals',proOnly:true,hiddenUntilPro:true,exclusiveCollection:'originals',collections:['originals'],original:true},
              {id:'alx-original-004',name:'Сапожник',recipe:[{flavor:'Замша',percent:30},{flavor:'Лесные ягоды',percent:70}],author:'ALX Originals',proOnly:true,hiddenUntilPro:true,exclusiveCollection:'originals',collections:['originals'],original:true},
              {id:'alx-original-005',name:'Luxury Viski-Cola',recipe:[{flavor:'Мармеладная кола',percent:40},{flavor:'Виски',percent:30},{flavor:'Ганимед',percent:30}],author:'ALX Originals',proOnly:true,hiddenUntilPro:true,exclusiveCollection:'originals',collections:['originals'],original:true}
            ];
            await page.route('**/api/originals',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,collection:'originals',author:'ALX Originals',mixes})}));
            await page.route('**/api/stars-status',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,entitlement:{plan:'pro',status:'active',active:true,expiresAt:Date.now()+86400000,source:'smoke'},offer:{priceStars:149,periodDays:30,recurring:true}})}));
            await page.goto(APP+'&pro=1',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('#alxBottomNav [data-tab="pro"]',{timeout:15000});
            await page.click('#alxBottomNav [data-tab="pro"]');
            await page.waitForFunction(()=>document.querySelectorAll('#alxProLibrary [data-pro-card]').length===7,null,{timeout:10000});
            if (await page.locator('#alxOriginalsCatalog').count()) throw new Error('Legacy catalog exists for PRO');
            await page.click('[data-pro-select="originals"]');
            await page.waitForFunction(()=>!document.querySelector('#alxProLibrary')?.classList.contains('show'),null,{timeout:10000});
            const scenario=await page.evaluate(()=>JSON.parse(localStorage.getItem('alx_oracle_scenario')||'{}'));
            if (scenario.collection!=='originals') throw new Error('Originals direction not selected');
            if (!await page.locator('#alxBottomNav [data-tab="home"].active').count()) throw new Error('Home not active');
            await page.click('#orbWrap');
            await page.waitForFunction(()=>['Bazar Night','Дорогая вишня','Мускус тайм','Сапожник','Luxury Viski-Cola'].includes(document.querySelector('.mix-card-title')?.textContent||''),null,{timeout:25000});
            const cardText=await page.locator('#mixCard').textContent();
            if (!cardText?.includes('ALX Originals')) throw new Error('Originals author missing on revealed card');
            if (errors.length) throw new Error(errors.join(' | '));
            await context.close();
          }

          console.log('PASS: all PRO directions are Oracle-first; Originals has no browseable catalog.');
          await browser.close();
          JS
          node smoke.mjs
