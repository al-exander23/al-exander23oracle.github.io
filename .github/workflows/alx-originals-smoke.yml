name: ALX Originals smoke check

on:
  push:
    paths:
      - '.github/workflows/alx-originals-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify protected endpoint and removed public JSON
        run: |
          set -e
          for i in $(seq 1 24); do
            CODE=$(curl -sS -o /tmp/originals-api.txt -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              --data '{"initData":""}' \
              https://al-exander23oracle-github-io.vercel.app/api/originals || true)
            echo "API attempt $i: HTTP $CODE"
            if [ "$CODE" = "401" ]; then break; fi
            sleep 5
          done
          test "$CODE" = "401"
          STATIC_CODE=$(curl -sS -o /tmp/originals-static.txt -w '%{http_code}' \
            'https://al-exander23.github.io/al-exander23oracle.github.io/data/alx-originals-pro-v1.json?smoke=123' || true)
          echo "Removed static file: HTTP $STATIC_CODE"
          test "$STATIC_CODE" = "404"

      - name: Prepare Playwright
        run: |
          mkdir -p /tmp/alx-originals-smoke && cd /tmp/alx-originals-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify FREE isolation and PRO Originals flow
        working-directory: /tmp/alx-originals-smoke
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const APP = 'https://al-exander23.github.io/al-exander23oracle.github.io/?smoke=originals-v123';
          const browser = await chromium.launch({ headless: true });

          async function dismissOnboarding(page) {
            const tour = page.locator('#alxOnboarding.show');
            if (await tour.count()) {
              await page.click('#alxTourSkip');
              await page.waitForFunction(() => !document.querySelector('#alxOnboarding')?.classList.contains('show'));
            }
          }

          async function commonRoutes(page) {
            await page.route('**/*', async route => {
              const url = route.request().url();
              if (url.includes('fonts.googleapis.com') || url.includes('fonts.gstatic.com') || url.includes('telegram.org/js/telegram-web-app.js')) {
                return route.abort();
              }
              return route.continue();
            });
          }

          // FREE: normal app works and ALX Originals is not visible at all.
          {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await commonRoutes(page);
            await page.goto(APP, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('#orbWrap', { state: 'visible', timeout: 15000 });
            await dismissOnboarding(page);
            await page.click('#orbWrap');
            await page.waitForFunction(() => /^№\s*\d+/.test(document.querySelector('#counter')?.textContent || ''), null, { timeout: 25000 });
            await page.evaluate(() => document.getElementById('tasteBtnTop')?.click());
            await page.waitForFunction(() => document.querySelector('#tasteOverlay')?.classList.contains('show'), null, { timeout: 10000 });
            await page.waitForSelector('#scenarioOracleSection', { timeout: 10000 });
            const originalsCount = await page.locator('[data-scenario-collection="originals"]').count();
            if (originalsCount !== 0) throw new Error('FREE user can see ALX Originals');
            if (errors.length) throw new Error(`FREE page errors: ${errors.join(' | ')}`);
            await page.close();
          }

          // PRO client flow: mock only the already-authenticated API response so
          // we can test UI/selection without forging real Telegram initData.
          {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              localStorage.setItem('alx_oracle_pro_entitlement', JSON.stringify({
                plan: 'pro', status: 'active', expiresAt: Date.now() + 86400000, source: 'smoke-test'
              }));
              window.Telegram = { WebApp: { initData: 'smoke-init-data', platform: 'android' } };
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.route('**/api/originals', route => route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify({ ok: true, collection: 'originals', mixes: [
                { id:'alx-original-001', name:'Bazar Night', description:'ALX Original', recipe:[{flavor:'Пан-расс',percent:10},{flavor:'Блэк Афгано',percent:30},{flavor:'Индийский перец',percent:10},{flavor:'Чернослив',percent:50}], author:'Alexander · ALX Originals', proOnly:true, hiddenUntilPro:true, exclusiveCollection:'originals', collections:['originals'], original:true },
                { id:'alx-original-002', name:'Дорогая вишня', description:'ALX Original', recipe:[{flavor:'Бакара Руж',percent:80},{flavor:'Вишня',percent:20}], author:'Alexander · ALX Originals', proOnly:true, hiddenUntilPro:true, exclusiveCollection:'originals', collections:['originals'], original:true },
                { id:'alx-original-003', name:'Мускус тайм', description:'ALX Original', recipe:[{flavor:'Мускусная вишня',percent:60},{flavor:'Пан-расс',percent:20},{flavor:'Черешня',percent:20}], author:'Alexander · ALX Originals', proOnly:true, hiddenUntilPro:true, exclusiveCollection:'originals', collections:['originals'], original:true },
                { id:'alx-original-004', name:'Сапожник', description:'ALX Original', recipe:[{flavor:'Замша',percent:30},{flavor:'Лесные ягоды',percent:70}], author:'Alexander · ALX Originals', proOnly:true, hiddenUntilPro:true, exclusiveCollection:'originals', collections:['originals'], original:true },
                { id:'alx-original-005', name:'Luxury Viski-Cola', description:'ALX Original', recipe:[{flavor:'Мармеладная кола',percent:40},{flavor:'Виски',percent:30},{flavor:'Ганимед',percent:30}], author:'Alexander · ALX Originals', proOnly:true, hiddenUntilPro:true, exclusiveCollection:'originals', collections:['originals'], original:true }
              ]})
            }));
            await commonRoutes(page);
            await page.goto(APP + '&pro=1', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('#orbWrap', { state: 'visible', timeout: 15000 });
            await dismissOnboarding(page);
            await page.evaluate(() => document.getElementById('tasteBtnTop')?.click());
            await page.waitForFunction(() => document.querySelector('#tasteOverlay')?.classList.contains('show'), null, { timeout: 10000 });
            const originals = page.locator('[data-scenario-collection="originals"]');
            await originals.waitFor({ state: 'visible', timeout: 10000 });
            const text = await originals.textContent();
            if (!text?.includes('ALX Originals') || !text?.includes('5')) throw new Error(`Unexpected Originals button: ${text}`);
            await originals.click();
            await page.click('#tasteClose');
            await page.click('#orbWrap');
            await page.waitForFunction(() => {
              const names = ['Bazar Night','Дорогая вишня','Мускус тайм','Сапожник','Luxury Viski-Cola'];
              return names.includes(document.querySelector('.mix-card-title')?.textContent || '');
            }, null, { timeout: 25000 });
            const author = await page.locator('.mix-card-foot span').first().textContent();
            if (!author?.includes('Alexander · ALX Originals')) throw new Error(`Wrong author: ${author}`);
            if (errors.length) throw new Error(`PRO page errors: ${errors.join(' | ')}`);
            await context.close();
          }

          console.log('PASS: FREE hidden; protected endpoint rejects unauthenticated access; PRO Originals flow works.');
          await browser.close();
          JS
          node smoke.mjs
