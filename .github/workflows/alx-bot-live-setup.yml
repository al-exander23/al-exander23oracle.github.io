name: ALX bot live setup

on:
  push:
    paths:
      - 'api/bot-setup-once.js'
      - 'api/telegram-webhook.js'
      - 'pay/support/**'
      - '.github/workflows/alx-bot-live-setup.yml'
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Apply bot profile and verify live resources
        shell: bash
        run: |
          set -euo pipefail
          VERCEL='https://al-exander23oracle-github-io.vercel.app'
          PAY='https://alx-pay.alxoracle.workers.dev'

          setup_ok=0
          for i in {1..24}; do
            echo "Bot setup attempt $i"
            status=$(curl -sS -o /tmp/setup.json -w '%{http_code}' -X POST "$VERCEL/api/bot-setup-once" || true)
            cat /tmp/setup.json 2>/dev/null || true; echo
            if [ "$status" = '200' ] && python3 - <<'PY'
          import json
          with open('/tmp/setup.json', encoding='utf-8') as f:
              data = json.load(f)
          raise SystemExit(0 if data.get('ok') is True and data.get('configured') == 6 else 1)
          PY
            then
              setup_ok=1
              break
            fi
            sleep 10
          done
          test "$setup_ok" = '1'

          visual=$(curl -sS -o /tmp/bot.jpg -w '%{http_code}' "$VERCEL/api/bot-visual")
          test "$visual" = '200'
          test "$(wc -c < /tmp/bot.jpg)" -gt 5000

          support_ok=0
          for i in {1..24}; do
            echo "Support attempt $i"
            status=$(curl -sS -o /tmp/support.html -w '%{http_code}' "$PAY/support/" || true)
            if [ "$status" = '200' ] && grep -q 'Открыть ALX Pay' /tmp/support.html; then
              support_ok=1
              break
            fi
            sleep 10
          done
          test "$support_ok" = '1'

          webhook=$(curl -sS -o /tmp/webhook.json -w '%{http_code}' -X POST "$VERCEL/api/telegram-webhook" -H 'Content-Type: application/json' --data '{}')
          test "$webhook" = '401'

          echo 'PASS: bot profile applied, branded visual live, ALX Pay support link live, webhook protected'
