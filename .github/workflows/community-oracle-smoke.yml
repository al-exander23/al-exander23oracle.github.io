name: ALX Community Oracle Smoke

on:
  push:
    paths:
      - '.github/workflows/community-oracle-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify live Community backend and published data
        run: |
          set -e
          for i in $(seq 1 48); do
            BODY=$(curl -fsSL 'https://alx-pay.alxoracle.workers.dev/api/community/health' || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"version":"1.31.0-community-oracle"'; then
              PUBLISHED=$(printf '%s' "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('published',0))")
              TOTAL=$(printf '%s' "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total',0))")
              echo "TOTAL=$TOTAL PUBLISHED=$PUBLISHED"
              test "$PUBLISHED" -ge 1
              test "$TOTAL" -ge 1
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Wait for frontend
        run: |
          set -e
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL 'https://al-exander23.github.io/al-exander23oracle.github.io/?community-oracle-smoke=1' || true)
            if echo "$HTML" | grep -q 'app.js?v=1.31.0-community-oracle' \
              && echo "$HTML" | grep -q 'cards.css?v=1.31.0-community-oracle' \
              && echo "$HTML" | grep -q 'community.js?v=1.31.0-community-oracle'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Prepare Playwright
        run: |
          mkdir -p /tmp/alx-community-oracle && cd /tmp/alx-community-oracle
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify Community Oracle UI and provenance
        working-directory: /tmp/alx-community-oracle
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const APP='https://al-exander23.github.io/al-exander23oracle.github.io/?community-oracle-smoke=v131';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          await context.addInitScript(()=>{
            localStorage.setItem('alx_oracle_onboarding_v1','done');
            localStorage.setItem('alx_oracle_pro_entitlement',JSON.stringify({
              plan:'pro',status:'active',expiresAt:Date.now()+86400000,source:'smoke'
            }));
            window.Telegram={WebApp:{
              initData:'mock-init',
              initDataUnsafe:{user:{id:101,first_name:'Test',username:'testuser'}},
              platform:'ios',
              ready:()=>{},
              expand:()=>{},
              setHeaderColor:()=>{},
              HapticFeedback:{impactOccurred:()=>{},notificationOccurred:()=>{}},
              openTelegramLink:()=>{},
              showConfirm:(_m,cb)=>cb(true)
            }};
          });

          const communityMix={
            id:'cm_oracle_test',
            title:'Community Smoke Mix',
            description:'Рецепт участника для проверки Оракула.',
            author:'@member',
            strength:3,
            recipe:[
              {flavor:'Вишня',percent:40},
              {flavor:'Личи',percent:30},
              {flavor:'Холод',percent:30}
            ],
            rating:4.8,ratingCount:12,rankPosition:1,saves:5,views:8,
            myRating:null,saved:false,isMine:false,createdAt:Date.now()
          };

          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));

          await page.route('**/api/stars-status',route=>route.fulfill({
            status:200,contentType:'application/json',
            body:JSON.stringify({ok:true,entitlement:{plan:'pro',status:'active',active:true,expiresAt:Date.now()+86400000,source:'smoke'},offer:{priceStars:149,periodDays:30,recurring:true}})
          }));
          await page.route('**/api/originals',route=>route.fulfill({
            status:200,contentType:'application/json',
            body:JSON.stringify({ok:true,collection:'originals',mixes:[]})
          }));
          await page.route('**/api/community/**',async route=>{
            const url=new URL(route.request().url());
            const action=url.pathname.split('/').pop();
            let body={};
            if(route.request().method()==='POST'){
              try{body=route.request().postDataJSON()||{};}catch{}
            }
            if(action==='list'){
              if(body.view!=='oracle') throw new Error('Expected oracle Community view, got '+body.view);
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
                ok:true,version:'1.31.0-community-oracle',view:'oracle',mixes:[communityMix]
              })});
            }
            return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true})});
          });
          await page.route('**/*',async route=>{
            const url=route.request().url();
            if(url.includes('fonts.googleapis.com')||url.includes('fonts.gstatic.com')||url.includes('telegram.org/js/telegram-web-app.js')) return route.abort();
            return route.fallback();
          });

          await page.goto(APP,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('#alxBottomNav [data-tab="pro"]',{timeout:15000});
          await page.click('#alxBottomNav [data-tab="pro"]');
          await page.waitForSelector('#proCommunityOracle',{timeout:10000});

          const communityBlock=await page.locator('.pro-community-entry').textContent();
          if(!communityBlock.includes('Открыть Community')||!communityBlock.includes('Выбирать шаром')) {
            throw new Error('Community dual actions missing: '+communityBlock);
          }

          await page.click('#proCommunityOracle');
          await page.waitForFunction(()=>{
            const el=document.querySelector('#alxHomeDirection');
            return el && el.textContent.includes('Community Mixes');
          },null,{timeout:10000});

          const homeDirection=await page.locator('#alxHomeDirection').textContent();
          if(!homeDirection.includes('Community Mixes')) throw new Error('Community mode not active');

          await page.click('#orbWrap');
          await page.waitForFunction(()=>{
            const card=document.querySelector('#mixCard');
            return card?.classList.contains('show') && card.textContent.includes('Community Smoke Mix');
          },null,{timeout:20000});

          const card=await page.locator('#mixCard').textContent();
          if(!card.includes('COMMUNITY')) throw new Error('Community rating/source label missing: '+card);
          if(!card.includes('Микс участника Community')) throw new Error('Community provenance badge missing: '+card);
          if(!card.includes('@member')) throw new Error('Community author missing: '+card);
          if(!card.includes('Вишня')||!card.includes('Личи')||!card.includes('Холод')) throw new Error('Community recipe missing: '+card);

          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          console.log('PASS: Community Oracle mode selects participant mix with clear provenance.');
          await browser.close();
          JS
          node smoke.mjs
