name: ALX Home Direction Smoke

on:
  push:
    paths:
      - '.github/workflows/home-direction-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for live assets
        run: |
          set -e
          for i in $(seq 1 36); do
            HTML=$(curl -fsSL 'https://al-exander23.github.io/al-exander23oracle.github.io/?home-direction-smoke=1' || true)
            if echo "$HTML" | grep -q 'home-direction.js?v=1.29.0-home-direction' && echo "$HTML" | grep -q 'home-direction.css?v=1.29.0-home-direction'; then
              echo 'Home direction assets are live'
              exit 0
            fi
            echo "waiting for Pages deploy: $i"
            sleep 5
          done
          exit 1

      - name: Prepare Playwright
        run: |
          mkdir -p /tmp/alx-home-direction && cd /tmp/alx-home-direction
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify direction flow
        working-directory: /tmp/alx-home-direction
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const APP='https://al-exander23.github.io/al-exander23oracle.github.io/?home-direction-smoke=v129b';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          await context.addInitScript(()=>{
            localStorage.setItem('alx_oracle_onboarding_v1', 'done');
            localStorage.setItem('alx_oracle_pro_entitlement', JSON.stringify({
              plan:'pro', status:'active', expiresAt:Date.now()+86400000, source:'smoke'
            }));
            localStorage.setItem('alx_oracle_scenario', JSON.stringify({
              mood:'any', company:'any', time:'any', collection:'any'
            }));
          });
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.route('**/api/stars-status', route=>route.fulfill({
            status:200, contentType:'application/json',
            body:JSON.stringify({ok:true, entitlement:{plan:'pro',status:'active',active:true,expiresAt:Date.now()+86400000,source:'smoke'}, offer:{priceStars:149,periodDays:30,recurring:true}})
          }));
          await page.route('**/api/originals', route=>route.fulfill({
            status:200, contentType:'application/json',
            body:JSON.stringify({ok:true,collection:'originals',author:'ALX Originals',mixes:[]})
          }));
          await page.route('**/*',async route=>{
            const url=route.request().url();
            if(url.includes('fonts.googleapis.com')||url.includes('fonts.gstatic.com')||url.includes('telegram.org/js/telegram-web-app.js')) return route.abort();
            return route.continue();
          });
          await page.goto(APP,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('#alxHomeDirection',{timeout:15000});
          let text=await page.locator('#alxHomeDirection').textContent();
          if(!text?.includes('Все миксы')||!text?.includes('Выбрать')) throw new Error('Default indicator wrong: '+text);

          await page.click('[data-home-direction-change]');
          await page.waitForFunction(()=>document.querySelector('#alxProLibrary')?.classList.contains('show'),null,{timeout:10000});
          await page.click('[data-pro-select="parfum"]');
          await page.waitForFunction(()=>document.querySelector('#alxHomeDirection')?.textContent?.includes('Направление · Parfum Lab'),null,{timeout:10000});
          text=await page.locator('#alxHomeDirection').textContent();
          if(!text?.includes('Изменить')||!text?.includes('Все миксы')) throw new Error('Filtered indicator wrong: '+text);

          let scenario=await page.evaluate(()=>JSON.parse(localStorage.getItem('alx_oracle_scenario')||'{}'));
          if(scenario.collection!=='parfum') throw new Error('Parfum was not stored: '+JSON.stringify(scenario));

          await page.click('[data-home-direction-all]');
          await page.waitForFunction(()=>document.querySelector('#alxHomeDirection')?.textContent?.includes('Все миксы'),null,{timeout:5000});
          scenario=await page.evaluate(()=>JSON.parse(localStorage.getItem('alx_oracle_scenario')||'{}'));
          if(scenario.collection!=='any') throw new Error('All mixes reset failed: '+JSON.stringify(scenario));

          await page.click('#orbWrap');
          await page.waitForFunction(()=>/^№\s*\d+/.test(document.querySelector('#counter')?.textContent||''),null,{timeout:25000});
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          console.log('PASS: home direction indicator, PRO selection, all-mixes reset and orb interaction.');
          await browser.close();
          JS
          node smoke.mjs
