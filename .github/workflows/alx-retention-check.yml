name: ALX retention live check

on:
  push:
    paths:
      - '.github/workflows/alx-retention-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for retention deployment
        shell: bash
        run: |
          set -euo pipefail
          HEALTH='https://alx-pay.alxoracle.workers.dev/api/retention/health'
          APP='https://al-exander23.github.io/al-exander23oracle.github.io/'

          for i in $(seq 1 36); do
            body=$(curl -fsS "$HEALTH" 2>/dev/null || true)
            if echo "$body" | grep -q '1.20.0-retention'; then
              echo "Worker retention ready: $body"
              break
            fi
            echo "Waiting for Worker deployment ($i/36)..."
            sleep 10
          done
          body=$(curl -fsS "$HEALTH")
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '1.20.0-retention'

          for i in $(seq 1 30); do
            html=$(curl -fsS "$APP" 2>/dev/null || true)
            if echo "$html" | grep -q 'retention.js?v=1.20.0-retention'; then
              echo 'GitHub Pages retention client ready.'
              break
            fi
            echo "Waiting for Pages deployment ($i/30)..."
            sleep 10
          done
          html=$(curl -fsS "$APP")
          echo "$html" | grep -q 'retention.js?v=1.20.0-retention'
          echo "$html" | grep -q 'retention.css?v=1.20.0-retention'

      - name: Verify reminder API guards
        shell: bash
        run: |
          set -euo pipefail
          URL='https://alx-pay.alxoracle.workers.dev/api/retention/reminder/set'
          code=$(curl -sS -o /tmp/options -w '%{http_code}' -X OPTIONS "$URL" \
            -H 'Origin: https://al-exander23.github.io' \
            -H 'Access-Control-Request-Method: POST')
          test "$code" = '204'

          code=$(curl -sS -o /tmp/noauth -w '%{http_code}' -X POST "$URL" \
            -H 'Origin: https://al-exander23.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"enabled":true,"localHour":19,"timezoneOffsetMin":0}')
          test "$code" = '401'
          grep -q 'Telegram' /tmp/noauth
          echo 'PASS: retention UI/backend are live and reminder settings require Telegram auth.'
