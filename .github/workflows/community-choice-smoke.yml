name: Temporary Community Choice Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages release
        shell: bash
        run: |
          set -euo pipefail
          URL="https://al-exander23.github.io/al-exander23oracle.github.io/?sha=${GITHUB_SHA}"
          for i in $(seq 1 24); do
            BODY="$(curl -fsSL --max-time 15 "$URL" || true)"
            if printf '%s' "$BODY" | grep -Fq "1.32.0-community-choice"; then
              echo "GitHub Pages contains Community Choice release."
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not update to Community Choice release." >&2
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alx-choice-smoke
          cd /tmp/alx-choice-smoke
          npm init -y >/dev/null 2>&1
          npm install --save-dev @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run onboarding and Community Choice smoke
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/alx-choice-smoke
          cat > smoke.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');

          const BASE = 'https://al-exander23.github.io/al-exander23oracle.github.io/';
          const LIST = 'https://alx-pay.alxoracle.workers.dev/api/community/list';

          const high = {
            id: 'choice-high',
            title: 'Choice High',
            description: 'High rated community recipe',
            author: 'Choice Author',
            strength: 4,
            rating: 4.7,
            ratingCount: 12,
            rankPosition: 1,
            saves: 8,
            views: 30,
            recipe: [
              { flavor: 'Lemon', percent: 60 },
              { flavor: 'Mint', percent: 40 }
            ]
          };

          const low = {
            id: 'choice-low',
            title: 'Choice Low',
            description: 'Not enough ratings',
            author: 'Regular Author',
            strength: 3,
            rating: 4.9,
            ratingCount: 9,
            rankPosition: 2,
            saves: 4,
            views: 18,
            recipe: [
              { flavor: 'Berry', percent: 50 },
              { flavor: 'Tea', percent: 50 }
            ]
          };

          async function mockTelegram(page) {
            await page.route('https://telegram.org/js/telegram-web-app.js', async route => {
              await route.fulfill({
                status: 200,
                contentType: 'application/javascript',
                body: `
                  window.Telegram = {
                    WebApp: {
                      initData: 'query_id=choice&user=%7B%22id%22%3A424242%7D&auth_date=1760000000&hash=choice',
                      initDataUnsafe: { user: { id: 424242, first_name: 'Smoke' } },
                      ready() {},
                      expand() {},
                      setHeaderColor() {},
                      openInvoice() {},
                      HapticFeedback: { impactOccurred() {} }
                    }
                  };
                `
              });
            });
          }

          test.use({ viewport: { width: 390, height: 844 } });

          test('updated onboarding v2 contains current truths', async ({ page }) => {
            const errors = [];
            page.on('pageerror', e => errors.push(String(e?.stack || e)));
            await mockTelegram(page);
            await page.goto(BASE + '?onboarding-v2=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });

            const overlay = page.locator('#alxOnboarding');
            await expect(overlay).toHaveClass(/show/, { timeout: 10000 });
            await expect(page.locator('#alxTourTitle')).toContainText('ALX Oracle');

            const seen = [];
            for (let i = 0; i < 9; i += 1) {
              seen.push(await page.locator('#alxTourText').innerText());
              if (i < 8) await page.locator('#alxTourNext').click();
            }

            const all = seen.join('\n');
            expect(all).toContain('5 подборов');
            expect(all).toContain('149 Telegram Stars');
            expect(all).toContain('299 ₽');
            expect(all).toContain('7 основных направлений');
            expect(all).toContain('Выбирать шаром');
            expect(all).toContain('Community Choice');
            expect(all).toContain('не ниже 4.5');
            expect(all).toContain('минимум 10 оценок');

            await page.locator('#alxTourNext').click();
            expect(await page.evaluate(() => localStorage.getItem('alx_oracle_onboarding_v2'))).toBe('done');
            expect(errors, errors.join('\n\n')).toEqual([]);
          });

          test('Community Choice threshold and Oracle card', async ({ page }) => {
            const errors = [];
            page.on('pageerror', e => errors.push(String(e?.stack || e)));
            await mockTelegram(page);

            await page.route(LIST, async route => {
              const body = JSON.parse(route.request().postData() || '{}');
              const mixes = body.view === 'oracle' ? [high] : [high, low];
              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ ok: true, version: '1.31.0-community-oracle', mixes })
              });
            });

            await page.addInitScript(() => {
              localStorage.setItem('alx_oracle_onboarding_v2', 'done');
              localStorage.setItem('alx_oracle_pro_entitlement', JSON.stringify({
                plan: 'pro',
                status: 'active',
                expiresAt: Date.now() + 86400000,
                source: 'smoke'
              }));
              localStorage.setItem('alx_oracle_scenario', JSON.stringify({
                mood: 'any', company: 'any', time: 'any', collection: 'any'
              }));
            });

            await page.goto(BASE + '?community-choice=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });

            await page.locator('#alxBottomNav [data-tab="pro"]').click();
            await expect(page.locator('#proCommunityOpen')).toBeVisible({ timeout: 10000 });
            await page.locator('#proCommunityOpen').click();

            const highCard = page.locator('[data-community-card="choice-high"]');
            const lowCard = page.locator('[data-community-card="choice-low"]');
            await expect(highCard).toContainText('COMMUNITY CHOICE', { timeout: 10000 });
            await expect(lowCard).not.toContainText('COMMUNITY CHOICE');

            await page.locator('#communityClose').click();
            await page.locator('#alxBottomNav [data-tab="pro"]').click();
            await page.locator('#proCommunityOracle').click();
            await expect(page.locator('#alxHomeDirection')).toContainText('Community Mixes', { timeout: 10000 });

            await page.locator('#orbWrap').click();
            const result = page.locator('#mixCard');
            await expect(result.locator('.mix-card-community-badge')).toContainText('Микс участника Community', { timeout: 30000 });
            await expect(result.locator('.mix-card-community-choice')).toHaveText('COMMUNITY CHOICE');
            await expect(result).toContainText('Choice Author');

            expect(errors, errors.join('\n\n')).toEqual([]);
          });
          EOF

          npx playwright test smoke.spec.js --reporter=line --workers=1
