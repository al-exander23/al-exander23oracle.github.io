name: ALX post webhook check

on:
  push:
    paths:
      - '.github/workflows/alx-post-webhook-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify ALX Pay after YooKassa webhook migration
        shell: bash
        run: |
          set -euo pipefail
          PAY='https://alx-pay.alxoracle.workers.dev'
          VERCEL='https://al-exander23oracle-github-io.vercel.app'

          code=$(curl -sS -o /tmp/config.json -w '%{http_code}' "$PAY/api/config")
          test "$code" = '200'
          python3 - <<'PY'
          import json
          with open('/tmp/config.json', encoding='utf-8') as f:
              data=json.load(f)
          offer=data.get('offer') or {}
          assert data.get('ok') is True
          assert offer.get('enabled') is True
          assert offer.get('periodDays') == 30
          PY

          webhook=$(curl -sS -o /tmp/webhook.json -w '%{http_code}' -X POST "$PAY/api/yookassa/webhook" -H 'Content-Type: application/json' --data '{"event":"test.ping"}')
          test "$webhook" = '200'
          grep -q '"ok":true' /tmp/webhook.json

          headers=$(curl -sS -D - -o /dev/null "$PAY/auth/telegram/start")
          printf '%s\n' "$headers" >/tmp/headers.txt
          grep -qi '^location: https://oauth.telegram.org/' /tmp/headers.txt
          grep -q 'alx-pay.alxoracle.workers.dev' /tmp/headers.txt

          mini=$(curl -sS -o /tmp/mini.json -w '%{http_code}' -X POST "$PAY/api/miniapp/status" -H 'Content-Type: application/json' --data '{}')
          test "$mini" = '401'

          stars=$(curl -sS -o /tmp/stars.json -w '%{http_code}' -X POST "$VERCEL/api/stars-status" -H 'Content-Type: application/json' --data '{}')
          test "$stars" = '401'

          echo 'PASS: ALX Pay live, webhook route reachable, OAuth uses branded domain, auth protections intact'
