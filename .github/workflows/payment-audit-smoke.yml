name: Temporary Payment Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify shared frontend module graph
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = fs.readdirSync('js').filter(name => name.endsWith('.js'));
          const shared = /from\s+['"]\.\/(pro|mixes|daily|analytics|achievements|scenario|ui|scene|oracle|pro-library)\.js(?:\?v=([^'"]+))?['"]/g;
          const bad = [];
          for (const file of files) {
            const src = fs.readFileSync(path.join('js', file), 'utf8');
            for (const match of src.matchAll(shared)) {
              const expected = ['analytics', 'pro-library'].includes(match[1])
                ? '1.34.0-funnel-analytics'
                : '1.33.0-payment-audit';
              if (match[2] !== expected) {
                bad.push(`${file}: ${match[0]} (expected ${expected})`);
              }
            }
          }
          if (bad.length) {
            console.error('Mixed shared module URLs found:\n' + bad.join('\n'));
            process.exit(1);
          }
          console.log('MODULE_GRAPH_OK');
          NODE

      - name: Verify analytics event coverage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const clientEvents = new Set();
          for (const file of fs.readdirSync('js').filter(name => name.endsWith('.js'))) {
            const src = fs.readFileSync(path.join('js', file), 'utf8');
            for (const match of src.matchAll(/trackAnalytics\(['"]([^'"]+)['"]/g)) {
              clientEvents.add(match[1]);
            }
          }

          const backend = fs.readFileSync('cloudflare/analytics.js', 'utf8');
          const block = backend.match(/const ALLOWED_EVENTS = new Set\(\[([\s\S]*?)\]\);/);
          if (!block) throw new Error('ALLOWED_EVENTS block not found');
          const allowed = new Set([...block[1].matchAll(/['"]([^'"]+)['"]/g)].map(m => m[1]));
          const missing = [...clientEvents].filter(event => !allowed.has(event)).sort();
          if (missing.length) {
            console.error('Analytics events rejected by backend: ' + missing.join(', '));
            process.exit(1);
          }

          const frontend = fs.readFileSync('js/analytics.js', 'utf8');
          if (!frontend.includes("const APP_VERSION = '1.34.0-funnel-analytics';")) {
            throw new Error('Frontend analytics version mismatch');
          }
          if (!frontend.includes("trackAnalytics('onboarding_completed', { steps: currentStep || 1 })")) {
            throw new Error('Onboarding completion still uses stale step count');
          }
          console.log('ANALYTICS_EVENT_COVERAGE_OK events=' + clientEvents.size);
          NODE

      - name: Unit-test YooKassa webhook hardening
        shell: bash
        run: |
          set -euo pipefail
          cp cloudflare/worker.js /tmp/alx-worker.mjs
          node --input-type=module <<'NODE'
          const { default: worker } = await import('file:///tmp/alx-worker.mjs?' + Date.now());

          function makeDb(storedPayment) {
            const state = { granted: false, paymentUpdated: false };
            return {
              state,
              prepare(sql) {
                const stmt = {
                  args: [],
                  bind(...args) { this.args = args; return this; },
                  async first() {
                    if (/FROM payments/i.test(sql)) return storedPayment;
                    if (/SELECT expires_at FROM entitlements/i.test(sql)) return null;
                    return null;
                  },
                  async run() {
                    if (/UPDATE payments SET status/i.test(sql)) state.paymentUpdated = true;
                    if (/INSERT INTO entitlements/i.test(sql)) state.granted = true;
                    return { success: true };
                  }
                };
                return stmt;
              }
            };
          }

          const providerPayment = {
            id: 'pay-audit-1',
            status: 'succeeded',
            paid: true,
            amount: { currency: 'RUB', value: '299.00' },
            metadata: {
              telegram_user_id: '424242',
              plan: 'alx-pro-30d',
              source: 'yookassa'
            }
          };

          globalThis.fetch = async (url) => {
            if (String(url).includes('api.yookassa.ru/v3/payments/pay-audit-1')) {
              return new Response(JSON.stringify(providerPayment), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              });
            }
            throw new Error('Unexpected fetch: ' + url);
          };

          const baseEnv = {
            YOOKASSA_SHOP_ID: 'live-shop',
            YOOKASSA_SECRET_KEY: 'test-secret-only-in-ci',
            ALX_EXTERNAL_PRICE_RUB: '299',
            SESSION_SECRET: 'session-secret',
          };

          async function webhook(db) {
            const request = new Request('https://alx-pay.example/api/yookassa/webhook', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ event: 'payment.succeeded', object: { id: 'pay-audit-1' } })
            });
            return worker.fetch(request, { ...baseEnv, DB: db });
          }

          const missing = makeDb(null);
          const missingResponse = await webhook(missing);
          if (missingResponse.status !== 400 || missing.state.granted) {
            throw new Error('Webhook granted PRO for payment absent from D1');
          }

          const valid = makeDb({
            id: 'pay-audit-1',
            telegram_user_id: '424242',
            provider: 'yookassa',
            amount_rub: 299
          });
          const validResponse = await webhook(valid);
          if (validResponse.status !== 200 || !valid.state.granted || !valid.state.paymentUpdated) {
            throw new Error('Valid ALX Pay payment did not grant PRO');
          }

          const unauthorizedDb = makeDb(null);
          const unauthorized = await worker.fetch(
            new Request('https://alx-pay.example/api/payment/create', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ method: 'bank_card' })
            }),
            { ...baseEnv, DB: unauthorizedDb }
          );
          if (unauthorized.status !== 401) {
            throw new Error('Unauthenticated payment create must return 401, got ' + unauthorized.status);
          }

          console.log('YOOKASSA_HARDENING_OK');
          NODE

      - name: Verify Telegram Stars production backend
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://al-exander23oracle-github-io.vercel.app"

          HEALTH=""
          for i in $(seq 1 30); do
            HEALTH="$(curl -fsSL --max-time 20 "$BASE/api/health" || true)"
            if printf '%s' "$HEALTH" | grep -Fq '1.35.0-launch-beta'; then
              break
            fi
            sleep 10
          done
          echo "$HEALTH"
          HEALTH="$HEALTH" node - <<'NODE'
          const data = JSON.parse(process.env.HEALTH || '{}');
          if (data.ok !== true || data.service !== 'alx-oracle-stars') throw new Error('Stars health failed');
          if (data.version !== '1.35.0-launch-beta') throw new Error('Stars backend launch-beta version is not live');
          if (data.telegramConfigured !== true) throw new Error('Telegram bot token is not configured');
          if (Number(data.priceStars) !== 149) throw new Error('Expected 149 Stars');
          if (data.externalPayEntitlements !== true) throw new Error('External entitlement bridge is disabled');
          console.log('STARS_HEALTH_OK');
          NODE

          for endpoint in stars-create-invoice stars-status; do
            code="$(curl -sS --max-time 20 -o /tmp/$endpoint.json -w '%{http_code}' \
              -X POST "$BASE/api/$endpoint" \
              -H 'Content-Type: application/json' \
              --data '{"initData":"invalid"}')"
            cat /tmp/$endpoint.json
            test "$code" = "401"
          done
          echo "STARS_AUTH_GUARDS_OK"

      - name: Verify live YooKassa worker and hardened auth
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://alx-pay.alxoracle.workers.dev"

          for i in $(seq 1 30); do
            curl -sS --max-time 20 -D /tmp/config.headers -o /tmp/config.json "$BASE/api/config" || true
            CREATE_CODE="$(curl -sS --max-time 20 -o /tmp/create.json -w '%{http_code}' \
              -X POST "$BASE/api/payment/create" \
              -H 'Content-Type: application/json' \
              --data '{"method":"bank_card"}' || true)"

            if grep -qi '^x-alx-payment-mode: live' /tmp/config.headers \
              && grep -qi '^x-alx-live-ready: yes' /tmp/config.headers \
              && [ "$CREATE_CODE" = "401" ]; then
              break
            fi
            sleep 10
          done

          cat /tmp/config.json
          cat /tmp/create.json

          grep -qi '^x-alx-payment-mode: live' /tmp/config.headers
          grep -qi '^x-alx-live-ready: yes' /tmp/config.headers
          test "$CREATE_CODE" = "401"

          CONFIG="$(cat /tmp/config.json)"
          CONFIG="$CONFIG" node - <<'NODE'
          const data = JSON.parse(process.env.CONFIG || '{}');
          if (data.ok !== true) throw new Error('ALX Pay config failed');
          if (data.offer?.enabled !== true) throw new Error('Live YooKassa channel is disabled');
          if (Number(data.offer?.priceRub) !== 299) throw new Error('Expected live price 299 RUB');
          if (Number(data.offer?.periodDays) !== 30) throw new Error('Expected 30-day PRO period');
          console.log('YOOKASSA_LIVE_OK');
          NODE

          SESSION="$(curl -fsSL --max-time 20 "$BASE/api/session")"
          SESSION="$SESSION" node - <<'NODE'
          const data = JSON.parse(process.env.SESSION || '{}');
          if (data.ok !== true || data.session !== null) throw new Error('Anonymous session endpoint mismatch');
          NODE

          MINI_CODE="$(curl -sS --max-time 20 -o /tmp/mini.json -w '%{http_code}' \
            -X POST "$BASE/api/miniapp/status" \
            -H 'Content-Type: application/json' \
            --data '{"initData":"invalid"}')"
          test "$MINI_CODE" = "401"
          echo "YOOKASSA_AUTH_GUARDS_OK"

      - name: Verify live funnel analytics
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://alx-pay.alxoracle.workers.dev"
          for i in $(seq 1 30); do
            BODY="$(curl -fsSL --max-time 20 "$BASE/api/analytics/health" || true)"
            if printf '%s' "$BODY" | grep -Fq '1.34.0-funnel-analytics'; then
              echo "$BODY"
              echo "ANALYTICS_LIVE_OK"
              exit 0
            fi
            sleep 10
          done
          echo "Live analytics did not reach 1.34.0-funnel-analytics" >&2
          exit 1

      - name: Verify launch copy on live ALX Pay
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://alx-pay.alxoracle.workers.dev"
          for i in $(seq 1 30); do
            HTML="$(curl -fsSL --max-time 20 "$BASE/?launch=${GITHUB_SHA}" || true)"
            if printf '%s' "$HTML" | grep -Fq 'Community Oracle' \
              && printf '%s' "$HTML" | grep -Fq 'Community Choice' \
              && printf '%s' "$HTML" | grep -Fq '7 направлений'; then
              echo "ALX_PAY_COPY_OK"
              exit 0
            fi
            sleep 10
          done
          echo "ALX Pay launch copy is stale" >&2
          exit 1

      - name: Verify GitHub Pages payment-audit release
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://al-exander23.github.io/al-exander23oracle.github.io"
          for i in $(seq 1 30); do
            HTML="$(curl -fsSL --max-time 20 "$BASE/?sha=${GITHUB_SHA}" || true)"
            if printf '%s' "$HTML" | grep -Fq 'js/pro-ui.js?v=1.33.0-payment-audit' \
              && printf '%s' "$HTML" | grep -Fq 'js/app.js?v=1.33.0-payment-audit' \
              && printf '%s' "$HTML" | grep -Fq 'js/analytics.js?v=1.34.0-funnel-analytics' \
              && printf '%s' "$HTML" | grep -Fq 'js/community.js?v=1.34.0-funnel-analytics'; then
              echo "PAGES_PAYMENT_AUDIT_OK"
              exit 0
            fi
            sleep 10
          done
          exit 1


      - name: Install Playwright for beta regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alx-beta
          cd /tmp/alx-beta
          npm init -y >/dev/null 2>&1
          npm install --save-dev @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run FREE, Stars and Community beta regression
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/alx-beta
          cat > beta.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');

          const BASE = 'https://al-exander23.github.io/al-exander23oracle.github.io/';
          test.use({ viewport: { width: 390, height: 844 } });

          async function mockTelegram(page, { inside = false, invoiceStatus = 'cancelled' } = {}) {
            await page.route('https://telegram.org/js/telegram-web-app.js', async route => {
              const body = inside
                ? "window.Telegram={WebApp:{initData:'query_id=beta&user=%7B%22id%22%3A424242%7D&auth_date=1760000000&hash=beta',initDataUnsafe:{user:{id:424242,first_name:'Beta'}},platform:'ios',ready(){},expand(){},setHeaderColor(){},HapticFeedback:{impactOccurred(){}},openInvoice(url,cb){setTimeout(()=>cb('" + invoiceStatus + "'),10);}}};"
                : "window.Telegram={WebApp:{initData:'',platform:'unknown',ready(){},expand(){},setHeaderColor(){}}};";
              await route.fulfill({ status: 200, contentType: 'application/javascript', body });
            });
            await page.route('https://alx-pay.alxoracle.workers.dev/api/analytics/event', route =>
              route.fulfill({ status: 200, contentType: 'application/json', body: '{"ok":true}' })
            );
          }

          async function initCommon(page) {
            await page.addInitScript(() => {
              localStorage.setItem('alx_oracle_onboarding_v2', 'done');
              localStorage.removeItem('alx_oracle_pro_entitlement');
              localStorage.removeItem('alx_oracle_scenario');
            });
          }

          test('FREE browser flow and external paywall', async ({ page }) => {
            const errors = [];
            page.on('pageerror', e => errors.push(String(e?.stack || e)));
            await mockTelegram(page, { inside: false });
            await initCommon(page);

            await page.goto(BASE + '?beta-free=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });
            await expect(page.locator('#alxBottomNav')).toBeVisible({ timeout: 15000 });
            await expect(page.locator('#alxProMainBanner')).toContainText('FREE');
            await expect(page.locator('#alxProMainBanner')).toContainText('299 ₽');

            await page.locator('#alxProMainBanner').click();
            await expect(page.locator('#proCheckout')).toContainText('Оплатить картой / СБП · 299 ₽');

            await page.locator('#proClose').click();
            await page.locator('#orbWrap').click();
            await expect(page.locator('#mixCard .mix-card-title')).toBeVisible({ timeout: 30000 });

            expect(errors, errors.join('\n\n')).toEqual([]);
          });

          test('Telegram Stars cancel is safe and does not activate PRO', async ({ page }) => {
            const errors = [];
            page.on('pageerror', e => errors.push(String(e?.stack || e)));
            await mockTelegram(page, { inside: true, invoiceStatus: 'cancelled' });
            await initCommon(page);

            await page.route('https://al-exander23oracle-github-io.vercel.app/api/stars-status', route =>
              route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({
                  ok: true,
                  entitlement: { plan: 'free', status: 'inactive', active: false, expiresAt: null, source: null },
                  offer: { priceStars: 149, periodDays: 30, recurring: true }
                })
              })
            );
            await page.route('https://al-exander23oracle-github-io.vercel.app/api/stars-create-invoice', route =>
              route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({
                  ok: true,
                  invoiceLink: 'https://t.me/invoice-beta',
                  priceStars: 149,
                  periodDays: 30,
                  recurring: true
                })
              })
            );

            await page.goto(BASE + '?beta-stars=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });
            await expect(page.locator('#alxProMainBanner')).toContainText('149 ⭐', { timeout: 15000 });
            await page.locator('#alxProMainBanner').click();
            await expect(page.locator('#proCheckout')).toContainText('Подключить PRO · 149 ⭐');
            await page.locator('#proCheckout').click();
            await expect(page.locator('#proCheckoutNote')).toContainText('Оплата отменена — ничего не списано.', { timeout: 10000 });

            const state = await page.evaluate(() => JSON.parse(localStorage.getItem('alx_oracle_pro_entitlement') || 'null'));
            expect(state?.status || 'inactive').not.toBe('active');
            expect(errors, errors.join('\n\n')).toEqual([]);
          });

          test('PRO Community Oracle regression', async ({ page }) => {
            const errors = [];
            page.on('pageerror', e => errors.push(String(e?.stack || e)));
            await mockTelegram(page, { inside: true });
            await page.addInitScript(() => {
              localStorage.setItem('alx_oracle_onboarding_v2', 'done');
              localStorage.setItem('alx_oracle_pro_entitlement', JSON.stringify({
                plan: 'pro',
                status: 'active',
                expiresAt: Date.now() + 86400000,
                source: 'telegram-stars'
              }));
              localStorage.setItem('alx_oracle_scenario', JSON.stringify({
                mood: 'any', company: 'any', time: 'any', collection: 'any'
              }));
            });

            await page.route('https://al-exander23oracle-github-io.vercel.app/api/stars-status', route =>
              route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({
                  ok: true,
                  entitlement: { plan: 'pro', status: 'active', active: true, expiresAt: Date.now() + 86400000, source: 'telegram-stars' },
                  offer: { priceStars: 149, periodDays: 30, recurring: true }
                })
              })
            );
            await page.route('https://alx-pay.alxoracle.workers.dev/api/community/list', route =>
              route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({
                  ok: true,
                  mixes: [{
                    id: 'beta-community',
                    title: 'Beta Community',
                    description: 'Regression recipe',
                    author: 'Beta Author',
                    strength: 3,
                    rating: 4.8,
                    ratingCount: 12,
                    recipe: [
                      { flavor: 'Lemon', percent: 60 },
                      { flavor: 'Mint', percent: 40 }
                    ]
                  }]
                })
              })
            );

            await page.goto(BASE + '?beta-pro=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('#alxBottomNav [data-tab="pro"]').click();
            await expect(page.locator('#proCommunityOracle')).toBeVisible({ timeout: 10000 });
            await page.locator('#proCommunityOracle').click();
            await expect(page.locator('#alxHomeDirection')).toContainText('Community Mixes', { timeout: 10000 });
            await page.locator('#orbWrap').click();
            const card = page.locator('#mixCard');
            await expect(card.locator('.mix-card-community-badge')).toContainText('Beta Author', { timeout: 30000 });
            await expect(card.locator('.mix-card-community-choice')).toHaveText('COMMUNITY CHOICE');
            expect(errors, errors.join('\n\n')).toEqual([]);
          });
          EOF

          npx playwright test beta.spec.js --reporter=line --workers=1
