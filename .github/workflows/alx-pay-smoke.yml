name: ALX Pay smoke test

on:
  push:
    paths:
      - '.github/workflows/alx-pay-smoke.yml'
      - 'wrangler.toml'
      - 'cloudflare/worker-v2.js'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check ALX Pay live payment stack
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://alx-pay.sashaswag23.workers.dev'

          echo 'Checking root...'
          curl -fsS -o /tmp/root.html "$BASE/"
          test -s /tmp/root.html

          echo 'Checking config and payment dependencies...'
          passed=0
          for i in {1..12}; do
            curl -fsS "$BASE/api/config" -o /tmp/config.json || true
            curl -fsS "$BASE/api/_smoke/payment-health" -o /tmp/health.json || true
            echo 'config:'; cat /tmp/config.json 2>/dev/null || true; echo
            echo 'health:'; cat /tmp/health.json 2>/dev/null || true; echo

            if python3 - <<'PY'
          import json
          try:
              with open('/tmp/config.json', encoding='utf-8') as f:
                  cfg = json.load(f)
              with open('/tmp/health.json', encoding='utf-8') as f:
                  health = json.load(f)
          except Exception:
              raise SystemExit(1)
          offer = cfg.get('offer') or {}
          ok = (
              cfg.get('ok') is True
              and offer.get('priceRub') == 1
              and offer.get('periodDays') == 30
              and offer.get('enabled') is True
              and health.get('ok') is True
              and health.get('d1') is True
              and health.get('yookassa') is True
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              passed=1
              break
            fi
            sleep 10
          done

          if [ "$passed" -ne 1 ]; then
            echo 'FAIL: live ALX Pay payment stack is not healthy'
            exit 1
          fi

          echo 'PASS: price=1, D1 reachable, YooKassa credentials accepted'
