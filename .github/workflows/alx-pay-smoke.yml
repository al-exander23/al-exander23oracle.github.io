name: ALX Pay smoke test

on:
  push:
    paths:
      - '.github/workflows/alx-pay-smoke.yml'
      - 'wrangler.toml'
      - 'cloudflare/worker-v2.js'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check completed ALX Pay payment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://alx-pay.sashaswag23.workers.dev'

          passed=0
          for i in {1..12}; do
            curl -fsS "$BASE/api/config" -o /tmp/config.json || true
            curl -fsS "$BASE/api/_smoke/payment-result" -o /tmp/payment.json || true
            echo 'config:'; cat /tmp/config.json 2>/dev/null || true; echo
            echo 'payment:'; cat /tmp/payment.json 2>/dev/null || true; echo

            if python3 - <<'PY'
          import json
          try:
              with open('/tmp/config.json', encoding='utf-8') as f:
                  cfg = json.load(f)
              with open('/tmp/payment.json', encoding='utf-8') as f:
                  pay = json.load(f)
          except Exception:
              raise SystemExit(1)

          offer = cfg.get('offer') or {}
          ok = (
              cfg.get('ok') is True
              and offer.get('priceRub') == 1
              and offer.get('periodDays') == 30
              and offer.get('enabled') is True
              and pay.get('ok') is True
              and pay.get('paymentFound') is True
              and pay.get('latestPaymentSucceeded') is True
              and pay.get('amountRub') == 1
              and pay.get('activeLinkedEntitlement') is True
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              passed=1
              break
            fi
            sleep 10
          done

          if [ "$passed" -ne 1 ]; then
            echo 'FAIL: payment or entitlement is not complete'
            exit 1
          fi

          echo 'PASS: 1 RUB payment succeeded and active entitlement is linked'
