name: ALX Pay smoke test

on:
  push:
    paths:
      - '.github/workflows/alx-pay-smoke.yml'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check ALX Pay root and config
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://alx-pay.sashaswag23.workers.dev'
          echo 'Checking root...'
          curl -fsS -o /tmp/root.html "$BASE/"
          test -s /tmp/root.html

          echo 'Checking config...'
          passed=0
          for i in {1..12}; do
            curl -fsS "$BASE/api/config" -o /tmp/config.json
            cat /tmp/config.json
            if python3 - <<'PY'
          import json
          with open('/tmp/config.json', encoding='utf-8') as f:
              data = json.load(f)
          offer = data.get('offer') or {}
          ok = (
              data.get('ok') is True
              and offer.get('priceRub') == 1
              and offer.get('periodDays') == 30
              and offer.get('enabled') is True
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              passed=1
              break
            fi
            sleep 10
          done

          if [ "$passed" -ne 1 ]; then
            echo 'FAIL: live Worker did not reach priceRub=1 / enabled=true'
            exit 1
          fi

          echo 'PASS: live Worker priceRub=1, periodDays=30, enabled=true'
