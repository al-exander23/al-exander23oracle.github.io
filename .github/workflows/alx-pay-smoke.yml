name: ALX Pay smoke test

on:
  push:
    paths:
      - '.github/workflows/alx-pay-smoke.yml'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check ALX Pay root and config
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://alx-pay.sashaswag23.workers.dev'

          curl -fsS -o /tmp/root.html "$BASE/"
          test -s /tmp/root.html
          curl -fsS "$BASE/api/config" -o /tmp/config.json
          cat /tmp/config.json

          python3 - <<'PY'
          import json
          with open('/tmp/config.json', encoding='utf-8') as f:
              cfg = json.load(f)
          offer = cfg.get('offer') or {}
          assert cfg.get('ok') is True, cfg
          assert offer.get('priceRub') == 1, cfg
          assert offer.get('periodDays') == 30, cfg
          assert offer.get('enabled') is True, cfg
          print('PASS: live ALX Pay config is ready for 1 RUB test payments')
          PY
