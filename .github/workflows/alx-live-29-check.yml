name: ALX live 29 check

on:
  push:
    paths:
      - '.github/workflows/alx-live-29-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify temporary live price
        shell: bash
        run: |
          set -euo pipefail
          URL='https://alx-pay.alxoracle.workers.dev/api/config'
          ok=0
          for i in {1..24}; do
            headers=$(mktemp)
            code=$(curl -sS -D "$headers" -o /tmp/config.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = '200' ] && grep -qi '^x-alx-payment-mode: live' "$headers" && grep -qi '^x-alx-live-ready: yes' "$headers"; then
              python3 - <<'PY'
          import json
          with open('/tmp/config.json', encoding='utf-8') as f:
              d=json.load(f)
          offer=d.get('offer') or {}
          assert d.get('ok') is True
          assert offer.get('enabled') is True
          assert offer.get('priceRub') == 29
          assert offer.get('periodDays') == 30
          PY
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = '1'
          echo 'PASS: ALX Pay live price is 29 RUB'
