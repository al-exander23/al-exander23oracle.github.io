name: ALX OIDC live check

on:
  push:
    paths:
      - '.github/workflows/alx-oidc-live-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare Telegram callback registrations
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID='8910147832'
          CHALLENGE='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_'

          probe() {
            name="$1"
            redirect="$2"
            code=$(curl -sS -G -o "/tmp/${name}.txt" -w '%{http_code}' 'https://oauth.telegram.org/auth' \
              --data-urlencode "client_id=${CLIENT_ID}" \
              --data-urlencode "redirect_uri=${redirect}" \
              --data-urlencode 'response_type=code' \
              --data-urlencode 'scope=openid profile' \
              --data-urlencode 'state=alx-oauth-probe' \
              --data-urlencode "code_challenge=${CHALLENGE}" \
              --data-urlencode 'code_challenge_method=S256' || true)
            echo "${name}_HTTP=${code}"
            if grep -Eqi 'redirect_uri[[:space:]_:-]*(required|invalid|not allowed)|invalid[[:space:]_:-]*redirect' "/tmp/${name}.txt"; then
              echo "${name}_REDIRECT_REJECTED=yes"
            else
              echo "${name}_REDIRECT_REJECTED=no"
            fi
          }

          probe old 'https://alx-pay.sashaswag23.workers.dev/auth/telegram/callback'
          probe new 'https://alx-pay.alxoracle.workers.dev/auth/telegram/callback'
