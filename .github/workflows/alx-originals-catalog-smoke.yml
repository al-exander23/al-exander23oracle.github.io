name: ALX Originals catalog smoke

on:
  push:
    paths:
      - '.github/workflows/alx-originals-catalog-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for live catalog assets
        run: |
          set -e
          for i in $(seq 1 30); do
            HTML=$(curl -fsSL 'https://al-exander23.github.io/al-exander23oracle.github.io/?catalog-smoke=1' || true)
            if echo "$HTML" | grep -q 'originals-nav-hook.js?v=1.24.0-originals-catalog'; then
              echo 'Catalog assets are live'
              exit 0
            fi
            echo "waiting for Pages deploy: $i"
            sleep 5
          done
          echo 'Catalog assets did not appear in time'
          exit 1

      - name: Prepare Playwright
        run: |
          mkdir -p /tmp/alx-catalog-smoke && cd /tmp/alx-catalog-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify FREE and PRO catalog flows
        working-directory: /tmp/alx-catalog-smoke
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const APP = 'https://al-exander23.github.io/al-exander23oracle.github.io/?catalog-smoke=v124';
          const browser = await chromium.launch({ headless: true });

          async function blockOptional(page) {
            await page.route('**/*', async route => {
              const url = route.request().url();
              if (url.includes('fonts.googleapis.com') || url.includes('fonts.gstatic.com') || url.includes('telegram.org/js/telegram-web-app.js')) return route.abort();
              return route.continue();
            });
          }

          // FREE: PRO tab opens a locked catalog without leaking recipe names.
          {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              localStorage.setItem('alx_oracle_onboarding_v1', 'done');
              localStorage.removeItem('alx_oracle_pro_entitlement');
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await blockOptional(page);
            await page.goto(APP+'&free=1', { waitUntil:'domcontentloaded', timeout:30000 });
            await page.waitForSelector('#alxBottomNav [data-tab="pro"]', { timeout:15000 });
            await page.click('#alxBottomNav [data-tab="pro"]');
            await page.waitForFunction(() => document.querySelector('#alxOriginalsCatalog')?.classList.contains('show'), null, { timeout:10000 });
            const lockedText = await page.locator('#alxOriginalsCatalogContent').textContent();
            if (!lockedText?.includes('ALX Originals') || !lockedText?.includes('Открыть с ALX PRO')) throw new Error('FREE locked catalog missing');
            for (const name of ['Bazar Night','Дорогая вишня','Мускус тайм','Сапожник','Luxury Viski-Cola']) {
              if (lockedText.includes(name)) throw new Error('FREE catalog leaked recipe name: '+name);
            }
            if (await page.locator('#alxProOverlay.show').count()) throw new Error('Legacy paywall opened before locked catalog');
            await page.click('#originalsUnlock');
            await page.waitForFunction(() => document.querySelector('#alxProOverlay')?.classList.contains('show'), null, { timeout:10000 });
            if (errors.length) throw new Error('FREE page errors: '+errors.join(' | '));
            await context.close();
          }

          // PRO: catalog exposes all five recipes and can hand selection back to the orb.
          {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              localStorage.setItem('alx_oracle_onboarding_v1', 'done');
              localStorage.setItem('alx_oracle_pro_entitlement', JSON.stringify({ plan:'pro', status:'active', expiresAt:Date.now()+86400000, source:'smoke' }));
              window.Telegram = { WebApp: { initData:'mock-init', platform:'android', openTelegramLink(){} } };
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await blockOptional(page);

            const mixes = [
              {id:'alx-original-001',name:'Bazar Night',description:'Авторский микс из закрытой коллекции ALX Originals.',recipe:[{flavor:'Пан-расс',percent:10},{flavor:'Блэк Афгано',percent:30},{flavor:'Индийский перец',percent:10},{flavor:'Чернослив',percent:50}],author:'ALX Originals',proOnly:true,hiddenUntilPro:true,exclusiveCollection:'originals',collections:['originals'],original:true},
              {id:'alx-original-002',name:'Дорогая вишня',description:'Авторский микс из закрытой коллекции ALX Originals.',recipe:[{flavor:'Бакара Руж',percent:80},{flavor:'Вишня',percent:20}],author:'ALX Originals',proOnly:true,hiddenUntilPro:true,exclusiveCollection:'originals',collections:['originals'],original:true},
              {id:'alx-original-003',name:'Мускус тайм',description:'Авторский микс из закрытой коллекции ALX Originals.',recipe:[{flavor:'Мускусная вишня',percent:60},{flavor:'Пан-расс',percent:20},{flavor:'Черешня',percent:20}],author:'ALX Originals',proOnly:true,hiddenUntilPro:true,exclusiveCollection:'originals',collections:['originals'],original:true},
              {id:'alx-original-004',name:'Сапожник',description:'Авторский микс из закрытой коллекции ALX Originals.',recipe:[{flavor:'Замша',percent:30},{flavor:'Лесные ягоды',percent:70}],author:'ALX Originals',proOnly:true,hiddenUntilPro:true,exclusiveCollection:'originals',collections:['originals'],original:true},
              {id:'alx-original-005',name:'Luxury Viski-Cola',description:'Авторский микс из закрытой коллекции ALX Originals.',recipe:[{flavor:'Мармеладная кола',percent:40},{flavor:'Виски',percent:30},{flavor:'Ганимед',percent:30}],author:'ALX Originals',proOnly:true,hiddenUntilPro:true,exclusiveCollection:'originals',collections:['originals'],original:true}
            ];

            await page.route('**/api/originals', route => route.fulfill({ status:200, contentType:'application/json', body:JSON.stringify({ok:true,collection:'originals',author:'ALX Originals',mixes}) }));
            await page.route('**/api/stars-status', route => route.fulfill({ status:200, contentType:'application/json', body:JSON.stringify({ok:true,entitlement:{plan:'pro',status:'active',active:true,expiresAt:Date.now()+86400000,source:'smoke'},offer:{priceStars:149,periodDays:30,recurring:true}}) }));

            await page.goto(APP+'&pro=1', { waitUntil:'domcontentloaded', timeout:30000 });
            await page.waitForSelector('#alxBottomNav [data-tab="pro"]', { timeout:15000 });
            await page.click('#alxBottomNav [data-tab="pro"]');
            await page.waitForFunction(() => document.querySelector('#alxOriginalsCatalog')?.classList.contains('show'), null, { timeout:10000 });
            await page.waitForFunction(() => document.querySelectorAll('#alxOriginalsCatalog [data-original-id]').length === 5, null, { timeout:10000 });
            const first = await page.locator('#originalsDetailHost').textContent();
            if (!first?.includes('Bazar Night') || !first?.includes('Пан-расс') || !first?.includes('10%') || !first?.includes('Автор: ALX Originals')) throw new Error('First catalog card is incomplete: '+first);
            await page.click('[data-original-id="alx-original-005"]');
            const fifth = await page.locator('#originalsDetailHost').textContent();
            if (!fifth?.includes('Luxury Viski-Cola') || !fifth?.includes('Мармеладная кола') || !fifth?.includes('40%')) throw new Error('Fifth catalog card is incomplete: '+fifth);
            await page.click('#originalsOracleMode');
            await page.waitForFunction(() => !document.querySelector('#alxOriginalsCatalog')?.classList.contains('show'), null, { timeout:5000 });
            await page.click('#orbWrap');
            await page.waitForFunction(() => ['Bazar Night','Дорогая вишня','Мускус тайм','Сапожник','Luxury Viski-Cola'].includes(document.querySelector('.mix-card-title')?.textContent || ''), null, { timeout:25000 });
            const author = await page.locator('.mix-card-foot span').first().textContent();
            if (!author?.includes('ALX Originals') || author.includes('Alexander')) throw new Error('Wrong card author: '+author);
            if (errors.length) throw new Error('PRO page errors: '+errors.join(' | '));
            await context.close();
          }

          console.log('PASS: ALX Originals catalog FREE lock + PRO browse + orb handoff.');
          await browser.close();
          JS
          node smoke.mjs
