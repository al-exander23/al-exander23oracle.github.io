name: ALX bot setup debug

on:
  push:
    paths:
      - '.github/workflows/alx-bot-setup-debug.yml'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Call setup once
        shell: bash
        run: |
          set -u
          status=$(curl -sS -o /tmp/setup.json -w '%{http_code}' -X POST 'https://al-exander23oracle-github-io.vercel.app/api/bot-setup-once' || true)
          echo "HTTP=$status"
          cat /tmp/setup.json 2>/dev/null || true
          echo
