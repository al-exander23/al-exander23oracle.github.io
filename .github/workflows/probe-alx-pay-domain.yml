name: Probe ALX Pay domain

on:
  push:
    paths:
      - '.github/workflows/probe-alx-pay-domain.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe likely workers.dev domains
        shell: bash
        run: |
          set -euo pipefail
          for host in \
            alx-pay.alxoracle.workers.dev \
            alx-pay.alx-oracle.workers.dev \
            alx-pay.alxoracleapp.workers.dev; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "https://$host/api/config" || true)
            echo "$host -> $code"
            if [ "$code" = "200" ]; then
              cat /tmp/body
            fi
          done
