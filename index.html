<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Микс-шар</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #0b0912;
    --bg-glow: #1c1330;
    --ball-1: #2b2733;
    --ball-2: #030203;
    --screen-bg: #0d0919;
    --neon: #ffdba3;
    --neon-soft: #fff2da;
    --accent: #ffb98a;
    --mint: #7de0c9;
    --violet: #a58bff;
    --text-muted: #9a90b3;
    --text-dim: #6a6285;
    --gold: #d9b878;
    --gold-soft: #f3e3bf;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: var(--bg-deep);
    font-family: 'Inter', sans-serif;
    color: var(--text-muted);
    user-select: none;
    -webkit-user-select: none;
  }

  .stage{
    position: relative;
    width: 100%; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 120% 60% at 50% 8%, var(--bg-glow) 0%, transparent 55%),
      radial-gradient(ellipse 90% 50% at 50% 100%, #150e24 0%, transparent 60%),
      var(--bg-deep);
    overflow: hidden;
  }

  .motes{ position:absolute; inset:0; pointer-events:none; }
  .mote{
    position:absolute; border-radius:50%;
    background: var(--mint);
    opacity:.16; filter: blur(1px);
    animation: drift linear infinite;
  }
  @keyframes drift{
    from{ transform: translateY(0) translateX(0); }
    to{ transform: translateY(-120px) translateX(20px); }
  }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 30px;
    opacity: .8;
  }

  .brand{
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    margin-bottom: 34px;
    background: linear-gradient(100deg, #cbaa6b 0%, #f6e3b4 30%, #cbaa6b 55%, #8f764a 78%, #f6e3b4 100%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: brand-sheen 7s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(214, 179, 118, 0.25));
  }
  @keyframes brand-sheen{
    0%, 100%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
  }

  /* ================= ORB — формат левитирующего глобуса ORBO ================= */
  .orb-wrap{
    position: relative;
    width: 276px; height: 276px;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
  }

  /* мягкое световое пятно снизу — как отражение на глянцевой подставке */
  .orb-puddle{
    position:absolute;
    bottom: -34px;
    width: 210px; height: 46px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(200,190,220,0.22) 0%, rgba(200,190,220,0.08) 45%, transparent 75%);
    filter: blur(6px);
    animation: puddle-breathe 5s ease-in-out infinite;
  }
  @keyframes puddle-breathe{
    0%,100%{ transform: scale(1); opacity: .95; }
    50%{ transform: scale(0.86); opacity: .55; }
  }

  .orb-halo{
    position:absolute;
    width: 320px; height: 320px;
    border-radius: 50%;
    background:
      radial-gradient(circle, rgba(255,219,163,0.16) 0%, transparent 50%),
      radial-gradient(circle, rgba(217,184,120,0.12) 22%, transparent 62%),
      radial-gradient(circle, rgba(165,139,255,0.06) 42%, transparent 74%);
    filter: blur(10px);
    animation: breathe 6s ease-in-out infinite;
    transition: opacity .4s ease;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); opacity:.62; }
    50%{ transform: scale(1.09); opacity:1; }
  }
  .orb-wrap.pulse .orb-halo{ opacity: 1; }

  /* тонкая золотая оправа по контуру шара — как у дорогого бильярдного шара в кейсе */
  .orb-frame{
    position: relative;
    width: 258px; height: 258px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    animation: levitate 5s ease-in-out infinite;
  }
  @keyframes levitate{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-7px); }
  }
  .orb-ring{
    position:absolute; inset:-4px;
    border-radius: 50%;
    background: conic-gradient(from 120deg,
      #8a744c, #f3e3bf, #b6934f, #4a3d28, #f3e3bf, #8a744c);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    opacity: .8;
    animation: spin 22s linear infinite;
  }

  /* чёрная глянцевая сфера-глобус */
  .orb{
    position: relative;
    width: 250px; height: 250px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 32% 26%, #565062 0%, var(--ball-1) 34%, var(--ball-2) 80%);
    box-shadow:
      0 26px 60px rgba(0,0,0,0.7),
      0 0 50px rgba(126, 90, 220, 0.2),
      0 0 26px rgba(217, 184, 120, 0.12),
      inset 0 -26px 48px rgba(0,0,0,0.8),
      inset 0 16px 32px rgba(255,255,255,0.05);
    overflow: hidden;
    transition: transform .18s ease;
  }
  .orb-wrap:active .orb{ transform: scale(0.965); }

  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }

  /* контейнер поверхности глобуса — материки и меридианы добавляются и позиционируются через JS */
  .orb-surface{
    position:absolute; inset:0;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
  }
  .meridian{
    position:absolute;
    top: 5%; bottom: 5%;
    width: 1.6px;
    border-radius: 2px;
    background: linear-gradient(to bottom, transparent 2%, rgba(255,255,255,0.32) 50%, transparent 98%);
    pointer-events: none;
  }
  .continent{
    position:absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  /* статичные широтные линии — при вращении вокруг вертикальной оси они не двигаются */
  .orb-latitude{
    position:absolute; inset:-2%;
    border-radius: 50%;
    background:
      linear-gradient(to bottom,
        transparent 21%, rgba(255,255,255,0.05) 22.5%, transparent 24%,
        transparent 45%, rgba(255,255,255,0.09) 48%, rgba(255,255,255,0.13) 50%, rgba(255,255,255,0.09) 52%, transparent 55%,
        transparent 76%, rgba(255,255,255,0.05) 77.5%, transparent 79%);
    pointer-events: none;
  }

  /* затемнение по краям — сфера «уходит» от взгляда, это и создаёт ощущение объёма и вращения */
  .orb-edge-shade{
    position:absolute; inset:0;
    border-radius: 50%;
    background: linear-gradient(to right,
      rgba(0,0,0,0.6) 0%, transparent 22%, transparent 78%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  /* фиксированный блик — физически не крутится вместе с поверхностью, как настоящий отблеск света */
  .orb-highlight{
    position:absolute;
    top: 6%; left: 22%;
    width: 46%; height: 30%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0) 70%);
    filter: blur(2.5px);
    pointer-events: none;
  }
  .orb-rim{
    position:absolute; inset:0;
    border-radius: 50%;
    background: radial-gradient(circle at 82% 46%, rgba(200,190,230,0.22) 0%, transparent 30%);
    pointer-events: none;
  }

  /* фиксированная теневая моделировка объёма */
  .orb-sheen{
    position:absolute; inset:0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 78%, rgba(0,0,0,0.42) 0%, transparent 42%);
    pointer-events: none;
  }

  .screen{
    position: relative;
    width: 172px; height: 172px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #16112a 0%, var(--screen-bg) 78%);
    box-shadow:
      inset 0 0 0 1px rgba(217,184,120,0.22),
      inset 0 0 0 3px rgba(255,255,255,0.04),
      inset 0 0 26px rgba(0,0,0,0.85),
      0 0 0 1px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    overflow: hidden;
    z-index: 2;
    opacity: 1;
    transform: scale(1);
    transition: opacity .6s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1), filter .6s ease;
  }

  .screen.off{
    opacity: 0;
    transform: scale(0.9);
    filter: brightness(0.15);
  }

  .screen::before{
    content:'';
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity:.45;
    pointer-events:none;
    z-index: 1;
  }

  .screen::after{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(115deg, transparent 32%, rgba(255,235,205,0.22) 49%, transparent 64%);
    transform: translateX(-130%);
    pointer-events:none;
    z-index: 2;
  }
  .screen.sweep::after{ animation: sweep .9s cubic-bezier(.22,1,.36,1); }
  @keyframes sweep{
    from{ transform: translateX(-130%); }
    to{ transform: translateX(130%); }
  }

  .screen-content{
    position:relative; z-index:1;
    width: 148px;
    padding: 0 4px;
  }

  .idle-icon{
    font-size: 26px;
    margin-bottom: 7px;
    color: var(--neon-soft);
    text-shadow: 0 0 6px var(--neon), 0 0 16px var(--neon), 0 0 32px rgba(255, 219, 163, 0.45);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; transform: scale(1); }
    50%{ opacity:1; transform: scale(1.08); }
  }

  .idle-text{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .mix-name{
    font-family: 'Lora', serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0;
    color: #fff8ea;
    line-height: 1.32;
    text-decoration: none;
    text-shadow:
      0 0 1px #fff,
      0 0 3px var(--neon),
      0 0 6px var(--neon);
    margin-bottom: 6px;
    display:-webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    opacity: 0;
    transform: translateY(7px);
    transition: opacity .6s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1);
  }
  .mix-name.in{ opacity: 1; transform: translateY(0); }

  .mix-desc{
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--neon-soft);
    text-decoration: none;
    text-shadow: 0 0 1px #fff, 0 0 2px rgba(255, 219, 163, 0.5), 0 0 5px rgba(255, 219, 163, 0.3);
    display:-webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    opacity: 0;
    transform: translateY(7px);
    transition: opacity .6s cubic-bezier(.22,1,.36,1) .09s, transform .6s cubic-bezier(.22,1,.36,1) .09s;
  }
  .mix-desc.in{ opacity: 1; transform: translateY(0); }

  .hint{
    margin-top: 38px;
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
    max-width: 270px;
    line-height: 1.5;
  }
  .hint b{ color: var(--gold-soft); font-weight: 500; }

  .permission-btn{
    margin-top: 22px;
    padding: 11px 24px;
    border-radius: 100px;
    border: 1px solid rgba(217,184,120,0.4);
    background: linear-gradient(180deg, rgba(217,184,120,0.14), rgba(217,184,120,0.05));
    color: var(--gold-soft);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .02em;
    cursor: pointer;
    transition: transform .2s ease;
  }
  .permission-btn:active{ transform: scale(.96); }

  .lock-btn{
    margin-top: 18px;
    padding: 9px 20px;
    border-radius: 100px;
    border: 1px solid rgba(217,184,120,0.32);
    background: rgba(217,184,120,0.06);
    color: var(--gold-soft);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: .02em;
    cursor: pointer;
    transition: transform .2s ease, background .25s ease, border-color .25s ease;
  }
  .lock-btn:active{ transform: scale(.96); }
  .lock-btn.active{
    border-color: rgba(217,184,120,0.65);
    background: linear-gradient(180deg, rgba(217,184,120,0.28), rgba(217,184,120,0.12));
    color: #fff8ea;
  }

  .counter{
    position:absolute;
    top: 22px; right: 22px;
    padding: 5px 12px;
    border-radius: 100px;
    border: 1px solid rgba(217,184,120,0.22);
    background: rgba(217,184,120,0.05);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--gold-soft);
    letter-spacing: .1em;
    opacity: .85;
  }

  @media (prefers-reduced-motion: reduce){
    .orb-halo, .idle-icon, .mote, .orb-ring{ animation: none !important; }
  }
</style>
</head>

    { name: "Гранатовый Мохито", desc: "Гранат 30% · Лайм 40% · Мята 30%" },
    { name: "Апельсиновый Джем", desc: "Апельсин 50% · Имбирь 35% · Мёд 15%" },
    { name: "Дынный Щербет", desc: "Дыня 45% · Лимон 25% · Мята 30%" },
    { name: "Персиковый Чай Каркаде", desc: "Персик 60% · Каркаде 20% · Лимон 20%" },
    { name: "Ежевичный Мохито", desc: "Ежевика 50% · Лайм 30% · Мята 20%" },
    { name: "Тропическая Маракуйя", desc: "Маракуйя 45% · Ананас 35% · Кокос 20%" },
    { name: "Вишнёвый Штрудель", desc: "Вишня 40% · Корица 40% · Ваниль 20%" },
    { name: "Медовый Апельсин", desc: "Апельсин 60% · Мёд 25% · Корица 15%" },
    { name: "Клубничный Мохито", desc: "Клубника 35% · Лайм 35% · Мята 30%" },
    { name: "Персиковая Роза", desc: "Персик 50% · Роза 25% · Мята 25%" },
    { name: "Инжир С Мёдом", desc: "Инжир 45% · Мёд 30% · Грецкий орех 25%" },
    { name: "Малиновый Лимонад", desc: "Малина 40% · Лимон 35% · Мята 25%" },
    { name: "Апельсиновый Гранат", desc: "Апельсин 55% · Гранат 30% · Мята 15%" },
    { name: "Кокосовый Лайм", desc: "Кокос 40% · Лайм 30% · Ваниль 30%" }
  ];
  var lastIndex = -1;
  function pickMix(){
    var i;
    do{ i = Math.floor(Math.random() * mixes.length); } while(i === lastIndex && mixes.length > 1);
    lastIndex = i;
    return mixes[i];
  }

  var orbWrap = document.getElementById('orbWrap');
  var orbSurface = document.getElementById('orbSurface');
  var screenEl = document.getElementById('screen');
  var content = document.getElementById('screenContent');
  var counterEl = document.getElementById('counter');
  var lockBtn = document.getElementById('lockBtn');
  var count = 0;
  var busy = false;
  var locked = false;

  var FADE_MS = 600;   // длительность выключения/включения экрана

  // ---- непрерывное плавное вращение глобуса вокруг вертикальной оси (без рывков) ----
  // материки и меридианы честно проецируются как на реальной вращающейся сфере:
  // едут по синусоиде и сжимаются (scaleX) ближе к краю, а не просто скроллятся плоско
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var IDLE_SPEED = reduceMotion ? 0 : 20;    // градусов в секунду в состоянии покоя
  var BURST_SPEED = reduceMotion ? 0 : 260;  // градусов в секунду во время ответа
  var speed = IDLE_SPEED;
  var targetSpeed = IDLE_SPEED;
  var angle = 0;
  var lastTs = null;

  var CENTER = 125, SPHERE_R = 108;
  function measureSphere(){
    var w = orbSurface.clientWidth || 250;
    CENTER = w / 2;
    SPHERE_R = w / 2 * 0.86;
  }
  measureSphere();
  window.addEventListener('resize', measureSphere);

  var MERIDIAN_COUNT = 9;
  var meridians = [];
  for(var mi = 0; mi < MERIDIAN_COUNT; mi++){
    var mEl = document.createElement('div');
    mEl.className = 'meridian';
    orbSurface.appendChild(mEl);
    meridians.push({ el: mEl, lon: mi * (360 / MERIDIAN_COUNT) });
  }

  var continents = [
    { lon: 8,   lat: -0.30, w: 46, h: 30, a: 0.42 },
    { lon: 52,  lat:  0.12, w: 30, h: 46, a: 0.40 },
    { lon: 96,  lat: -0.42, w: 26, h: 20, a: 0.34 },
    { lon: 140, lat:  0.34, w: 36, h: 22, a: 0.36 },
    { lon: 190, lat: -0.06, w: 22, h: 36, a: 0.30 },
    { lon: 232, lat:  0.40, w: 26, h: 16, a: 0.28 },
    { lon: 276, lat: -0.34, w: 20, h: 26, a: 0.30 },
    { lon: 322, lat:  0.16, w: 32, h: 24, a: 0.34 }
  ];
  continents.forEach(function(c){
    var cEl = document.createElement('div');
    cEl.className = 'continent';
    cEl.style.width = c.w + 'px';
    cEl.style.height = c.h + 'px';
    cEl.style.background = 'radial-gradient(ellipse, rgba(196,196,208,' + c.a + ') 0%, rgba(196,196,208,0) 75%)';
    orbSurface.appendChild(cEl);
    c.el = cEl;
  });

  function updateSurface(angleDeg){
    for(var i = 0; i < meridians.length; i++){
      var m = meridians[i];
      var rad = (m.lon + angleDeg) * Math.PI / 180;
      var s = Math.sin(rad), c = Math.cos(rad);
      var x = CENTER + SPHERE_R * s;
      var scaleX = Math.max(0.04, Math.abs(c));
      m.el.style.left = x + 'px';
      m.el.style.opacity = (Math.max(0, c) * 0.4).toFixed(3);
      m.el.style.transform = 'translateX(-50%) scaleX(' + scaleX.toFixed(3) + ')';
    }
    for(var j = 0; j < continents.length; j++){
      var cc = continents[j];
      var rad2 = (cc.lon + angleDeg) * Math.PI / 180;
      var s2 = Math.sin(rad2), c2 = Math.cos(rad2);
      var x2 = CENTER + SPHERE_R * s2;
      var y2 = CENTER + cc.lat * SPHERE_R;
      var scaleX2 = Math.max(0.06, Math.abs(c2));
      cc.el.style.left = x2 + 'px';
      cc.el.style.top = y2 + 'px';
      cc.el.style.opacity = Math.max(0, c2).toFixed(3);
      cc.el.style.transform = 'translate(-50%,-50%) scaleX(' + scaleX2.toFixed(3) + ')';
    }
  }

  function rotationTick(ts){
    if(lastTs === null) lastTs = ts;
    var dt = Math.min(ts - lastTs, 50) / 1000;
    lastTs = ts;
    // экспоненциальное сглаживание скорости — ускорение/торможение без единого скачка
    speed += (targetSpeed - speed) * Math.min(dt * 2.2, 1);
    angle = (angle + speed * dt) % 360;
    updateSurface(angle);
    requestAnimationFrame(rotationTick);
  }
  requestAnimationFrame(rotationTick);

  // ---- «оракул пишет ответ» — плавное посимвольное появление названия микса ----
  function typeText(el, text, onDone){
    el.textContent = '';
    var i = 0;
    (function step(){
      i++;
      el.textContent = text.slice(0, i);
      if(i < text.length){
        setTimeout(step, 20);
      } else if(onDone){
        onDone();
      }
    })();
  }

  function renderMix(mix){
    content.innerHTML =
      '<div class="mix-name" id="mn"></div>' +
      '<div class="mix-desc" id="md">' + mix.desc + '</div>';
    var mn = document.getElementById('mn');
    var md = document.getElementById('md');
    mn.classList.add('in');
    typeText(mn, mix.name, function(){
      md.classList.add('in');
    });
  }

  function triggerMix(){
    if(busy || locked) return;
    busy = true;
    haptic('medium');

    // плавный разгон вращения — без сброса угла, без рывка
    targetSpeed = BURST_SPEED;
    orbWrap.classList.add('pulse');

    // экран плавно гаснет
    screenEl.classList.add('off');

    setTimeout(function(){
      var mix = pickMix();
      renderMix(mix);
      count++;
      counterEl.textContent = '№ ' + String(count).padStart(3, '0');
      // и плавно загорается снова с новым миксом
      screenEl.classList.remove('off');
      screenEl.classList.remove('sweep');
      void screenEl.offsetWidth;
      screenEl.classList.add('sweep');
      lockBtn.style.display = 'inline-block';
    }, FADE_MS);

    setTimeout(function(){
      // плавное торможение обратно к спокойному вращению
      targetSpeed = IDLE_SPEED;
      orbWrap.classList.remove('pulse');
      busy = false;
    }, FADE_MS + 550);
  }

  // ---- определение встряхивания: только реальный рывок, не поворот ----
  // используем линейное ускорение БЕЗ гравитации — поворот/наклон телефона
  // меняет вектор гравитации, но не даёт скачка линейного ускорения
  var SHAKE_THRESHOLD = 15; // м/с² — порог именно резкого движения
  var SHAKE_COOLDOWN = 700; // мс между срабатываниями
  var gravity = { x: 0, y: 0, z: 0 };
  var gravityInit = false;
  var lastTriggerTs = 0;

  function processLinearAcceleration(x, y, z, now){
    var magnitude = Math.sqrt(x * x + y * y + z * z);
    if(magnitude > SHAKE_THRESHOLD && now - lastTriggerTs > SHAKE_COOLDOWN){
      lastTriggerTs = now;
      triggerMix();
    }
  }

  function handleMotion(e){
    var now = Date.now();

    // если браузер даёт готовое линейное ускорение — используем его напрямую
    var lin = e.acceleration;
    if(lin && lin.x !== null && lin.x !== undefined){
      processLinearAcceleration(lin.x, lin.y, lin.z, now);
      return;
    }

    // иначе вычитаем гравитацию сами через плавный low-pass фильтр
    var raw = e.accelerationIncludingGravity;
    if(!raw || raw.x === null || raw.x === undefined) return;

    if(!gravityInit){
      gravity.x = raw.x; gravity.y = raw.y; gravity.z = raw.z;
      gravityInit = true;
      return;
    }
    var alpha = 0.85;
    gravity.x = alpha * gravity.x + (1 - alpha) * raw.x;
    gravity.y = alpha * gravity.y + (1 - alpha) * raw.y;
    gravity.z = alpha * gravity.z + (1 - alpha) * raw.z;

    processLinearAcceleration(raw.x - gravity.x, raw.y - gravity.y, raw.z - gravity.z, now);
  }

  function attachShake(){
    window.addEventListener('devicemotion', handleMotion, true);
  }

  function initMotion(){
    if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
      var btn = document.createElement('button');
      btn.className = 'permission-btn';
      btn.textContent = 'Разрешить встряхивание';
      btn.onclick = function(){
        DeviceMotionEvent.requestPermission().then(function(state){
          if(state === 'granted'){ attachShake(); }
          btn.remove();
        }).catch(function(){ btn.remove(); });
      };
      document.getElementById('hint').insertAdjacentElement('afterend', btn);
    } else if(typeof DeviceMotionEvent !== 'undefined'){
      attachShake();
    }
  }
  initMotion();

  document.getElementById('orbWrap').addEventListener('click', triggerMix);

  lockBtn.addEventListener('click', function(){
    locked = !locked;
    lockBtn.textContent = locked ? '🔓 Открепить микс' : '🔒 Закрепить микс';
    lockBtn.classList.toggle('active', locked);
    haptic('light');
  });

  var motesEl = document.getElementById('motes');
  var colors = ['var(--mint)', 'var(--accent)'];
  for(var i = 0; i < 22; i++){
    var m = document.createElement('div');
    m.className = 'mote';
    var size = 2 + Math.random() * 3;
    m.style.width = size + 'px';
    m.style.height = size + 'px';
    m.style.left = Math.random() * 100 + '%';
    m.style.top = 40 + Math.random() * 60 + '%';
    m.style.background = colors[i % 2];
    m.style.animationDuration = (6 + Math.random() * 8) + 's';
    m.style.animationDelay = (Math.random() * 6) + 's';
    motesEl.appendChild(m);
  }
})();
</script>
