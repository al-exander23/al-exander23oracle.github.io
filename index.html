<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ALX Oracle — Микс Оракул</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css?v=5.0.0">
<link rel="stylesheet" href="css/orb.css?v=5.0.0">
<link rel="stylesheet" href="css/animations.css?v=5.0.0">
<link rel="stylesheet" href="css/cards.css?v=5.0.0">
<link rel="stylesheet" href="css/taste.css?v=5.0.0">
<link rel="stylesheet" href="css/theme-v5.css?v=5.0.0">
<link rel="stylesheet" href="css/theme-v5-5.css?v=5.5.0">
<link rel="stylesheet" href="css/theme-v5-5-fixes.css?v=5.5.0">
</head>
<body>

<div class="stage" id="stage">
  <div class="grain"></div>
  <div class="motes" id="motes"></div>

  <div class="top-toolbar" id="topToolbar" aria-label="Быстрые действия">
    <button class="icon-btn" id="favBtnTop" aria-label="Избранное">♡</button>
    <button class="icon-btn" id="historyBtnTop" aria-label="История">◷</button>
  </div>
  <div class="counter" id="counter"></div>

  <div class="orb-wrap phase-idle" id="orbWrap" aria-label="Коснись шара, чтобы узнать микс">
    <img class="v5-hero-art" id="v5HeroArt" alt="" aria-hidden="true" draggable="false">
    <div class="v5-title-smoke" aria-hidden="true"></div>
    <div class="v5-side-smoke" aria-hidden="true"></div>

    <div class="orb-surface" id="orbSurface" aria-hidden="true"></div>
    <div class="v5-orb-mask" aria-hidden="true"></div>
    <div class="orb-smoke v5-orb-smoke" id="orbSmoke" aria-hidden="true"></div>

    <!-- PROTECTED: live text remains a stable sibling, never inside a transformed smoke/glass layer. -->
    <div class="screen" id="screen">
      <div class="screen-content" id="screenContent">
        <div class="idle-icon">✦</div>
        <div class="idle-text">коснись шара —<br>узнай микс</div>
      </div>
    </div>
    <div class="v5-glass-front" aria-hidden="true"></div>
  </div>

  <div class="hint" id="hint">Коснись шара или встряхни телефон — оракул подберёт микс.</div>
  <button class="lock-btn" id="lockBtn" style="display:none;">🔒 Закрепить микс</button>

  <div class="mix-card" id="mixCard"></div>
  <button class="next-mix-btn" id="nextMixBtn" type="button">Следующий микс</button>
  <div class="footer-motto">Вдохновение всегда рядом</div>
</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-title" id="sheetTitle">
      <span></span>
      <button class="sheet-close" id="sheetClose">Закрыть ✕</button>
    </div>
    <div id="sheetList"></div>
  </div>
</div>

<script type="module" src="js/app.js?v=5.0.0"></script>
<script type="module" src="js/taste.js?v=5.0.0"></script>
<script type="module" src="js/theme-v5.js?v=5.0.0"></script>
<script type="module" src="js/theme-v5-5.js?v=5.5.0"></script>
</body>
</html>
