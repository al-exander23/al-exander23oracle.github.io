<style>
  :root{
    --bg-deep: #0b0912;
    --bg-glow: #1c1330;
    --ball-1: #2b2733;
    --ball-2: #030203;
    --screen-bg: #0d0919;
    --neon: #7effe0;
    --neon-soft: #baffef;
    --accent: #ffb98a;
    --mint: #7de0c9;
    --violet: #a58bff;
    --text-muted: #9a90b3;
    --text-dim: #6a6285;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: var(--bg-deep);
    font-family: 'Inter', sans-serif;
    color: var(--text-muted);
    user-select: none;
    -webkit-user-select: none;
  }

  .stage{
    position: relative;
    width: 100%; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 120% 60% at 50% 8%, var(--bg-glow) 0%, transparent 55%),
      radial-gradient(ellipse 90% 50% at 50% 100%, #150e24 0%, transparent 60%),
      var(--bg-deep);
    overflow: hidden;
  }

  .motes{ position:absolute; inset:0; pointer-events:none; }
  .mote{
    position:absolute; border-radius:50%;
    background: var(--mint);
    opacity:.16; filter: blur(1px);
    animation: drift linear infinite;
  }
  @keyframes drift{
    from{ transform: translateY(0) translateX(0); }
    to{ transform: translateY(-120px) translateX(20px); }
  }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 30px;
    opacity: .8;
  }

  /* ================= ORB — формат 🎱 ================= */
  .orb-wrap{
    position: relative;
    width: 268px; height: 268px;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
  }

  .orb-halo{
    position:absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(126,255,224,0.14) 0%, rgba(165,139,255,0.08) 45%, transparent 72%);
    filter: blur(8px);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); opacity:.65; }
    50%{ transform: scale(1.1); opacity:1; }
  }

  .orb-wrap.pulse .orb{ animation: spin360 .75s cubic-bezier(.45,.05,.35,1); }
  @keyframes spin360{
    0%{ transform: rotate(0deg) scale(1); }
    35%{ transform: rotate(150deg) scale(1.07); }
    70%{ transform: rotate(300deg) scale(0.98); }
    100%{ transform: rotate(360deg) scale(1); }
  }

  /* чёрная глянцевая сфера, как бильярдный 8-ball */
  .orb{
    position: relative;
    width: 250px; height: 250px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 32% 26%, #4c4658 0%, var(--ball-1) 32%, var(--ball-2) 78%);
    box-shadow:
      0 22px 55px rgba(0,0,0,0.65),
      0 0 60px rgba(126, 90, 220, 0.28),
      inset 0 -22px 44px rgba(0,0,0,0.75),
      inset 0 16px 30px rgba(255,255,255,0.06);
  }

  /* блик, который едет по поверхности шара — так честно выглядит вращение сферы */
  .orb-spin{
    position:absolute; inset:0;
    border-radius: 50%;
    overflow: hidden;
    animation: spin 9s linear infinite;
    pointer-events: none;
  }
  .orb-spin.burst{ animation-duration: 1.6s; }
  .orb-spin::before{
    content:'';
    position:absolute;
    top: 4%; left: 50%;
    width: 46%; height: 30%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 70%);
    filter: blur(3px);
  }
  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }

  /* фиксированный верхний блик — держит объём независимо от вращения */
  .orb-sheen{
    position:absolute; inset:0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 78%, rgba(0,0,0,0.4) 0%, transparent 42%);
    pointer-events: none;
  }

  .screen{
    position: relative;
    width: 172px; height: 172px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #16112a 0%, var(--screen-bg) 78%);
    box-shadow:
      inset 0 0 0 3px rgba(255,255,255,0.05),
      inset 0 0 24px rgba(0,0,0,0.85),
      0 0 0 1px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    overflow: hidden;
    z-index: 2;
  }

  .screen::before{
    content:'';
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity:.45;
    pointer-events:none;
  }

  .screen-content{
    position:relative; z-index:1;
    width: 148px;
    padding: 0 4px;
  }

  .idle-icon{
    font-size: 26px;
    margin-bottom: 7px;
    color: var(--neon-soft);
    text-shadow: 0 0 6px var(--neon), 0 0 16px var(--neon), 0 0 32px rgba(126,255,224,0.5);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; transform: scale(1); }
    50%{ opacity:1; transform: scale(1.08); }
  }

  .idle-text{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .mix-name{
    font-family: 'Fraunces', serif;
    font-size: 16.5px;
    font-weight: 600;
    color: #eafffa;
    line-height: 1.25;
    text-decoration: none;
    text-shadow:
      0 0 1px #fff,
      0 0 4px var(--neon),
      0 0 9px var(--neon);
    margin-bottom: 6px;
    opacity: 0;
    display:-webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .mix-desc{
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--neon-soft);
    text-decoration: none;
    text-shadow: 0 0 1px #fff, 0 0 3px rgba(126,255,224,0.6), 0 0 7px rgba(126,255,224,0.4);
    opacity: 0;
    display:-webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .mix-name.show, .mix-desc.show{
    animation: reveal .55s ease forwards;
  }
  .mix-desc.show{ animation-delay: .1s; }
  @keyframes reveal{
    from{ opacity:0; transform: translateY(5px) scale(.97); filter: blur(3px); }
    60%{ filter: blur(0); }
    to{ opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  .hint{
    margin-top: 38px;
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
    max-width: 270px;
    line-height: 1.5;
  }
  .hint b{ color: var(--text-muted); font-weight: 500; }

  .permission-btn{
    margin-top: 22px;
    padding: 11px 22px;
    border-radius: 100px;
    border: 1px solid rgba(126,255,224,0.35);
    background: rgba(126,255,224,0.08);
    color: var(--neon-soft);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .permission-btn:active{ transform: scale(.97); }

  .counter{
    position:absolute;
    top: 22px; right: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: .1em;
  }

  @media (prefers-reduced-motion: reduce){
    .orb-halo, .idle-icon, .mote, .orb-spin{ animation: none !important; }
    .orb-wrap.pulse .orb{ animation: none !important; }
  }
</style>
</head>

  ];
  var lastIndex = -1;
  function pickMix(){
    var i;
    do{ i = Math.floor(Math.random() * mixes.length); } while(i === lastIndex && mixes.length > 1);
    lastIndex = i;
    return mixes[i];
  }

  var orbWrap = document.getElementById('orbWrap');
  var orbSpin = document.getElementById('orbSpin');
  var content = document.getElementById('screenContent');
  var counterEl = document.getElementById('counter');
  var count = 0;
  var busy = false;

  function renderMix(mix){
    content.innerHTML =
      '<div class="mix-name" id="mn">' + mix.name + '</div>' +
      '<div class="mix-desc" id="md">' + mix.desc + '</div>';
    requestAnimationFrame(function(){
      document.getElementById('mn').classList.add('show');
      document.getElementById('md').classList.add('show');
    });
  }

  function triggerMix(){
    if(busy) return;
    busy = true;
    haptic('medium');

    orbWrap.classList.remove('pulse');
    orbSpin.classList.remove('burst');
    void orbWrap.offsetWidth;
    orbWrap.classList.add('pulse');
    orbSpin.classList.add('burst');

    var mn = document.getElementById('mn');
    var md = document.getElementById('md');
    if(mn) mn.classList.remove('show');
    if(md) md.classList.remove('show');

    setTimeout(function(){
      var mix = pickMix();
      renderMix(mix);
      count++;
      counterEl.textContent = '№ ' + String(count).padStart(3, '0');
    }, 180);

    setTimeout(function(){
      orbSpin.classList.remove('burst');
    }, 1500);
    setTimeout(function(){ busy = false; }, 750);
  }

  // ---- shake detection ----
  var SHAKE_THRESHOLD = 16;
  var lastX = null, lastY = null, lastZ = null, lastTime = 0;

  function handleMotion(e){
    var acc = e.accelerationIncludingGravity || e.acceleration;
    if(!acc || acc.x === null) return;
    var now = Date.now();
    if(now - lastTime < 100) return;

    if(lastX !== null){
      var dx = Math.abs(acc.x - lastX);
      var dy = Math.abs(acc.y - lastY);
      var dz = Math.abs(acc.z - lastZ);
      if(dx + dy + dz > SHAKE_THRESHOLD){
        triggerMix();
      }
    }
    lastX = acc.x; lastY = acc.y; lastZ = acc.z; lastTime = now;
  }

  function attachShake(){
    window.addEventListener('devicemotion', handleMotion, true);
  }

  function initMotion(){
    if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
      var btn = document.createElement('button');
      btn.className = 'permission-btn';
      btn.textContent = 'Разрешить встряхивание';
      btn.onclick = function(){
        DeviceMotionEvent.requestPermission().then(function(state){
          if(state === 'granted'){ attachShake(); }
          btn.remove();
        }).catch(function(){ btn.remove(); });
      };
      document.getElementById('hint').insertAdjacentElement('afterend', btn);
    } else if(typeof DeviceMotionEvent !== 'undefined'){
      attachShake();
    }
  }
  initMotion();

  document.getElementById('orbWrap').addEventListener('click', triggerMix);

  var motesEl = document.getElementById('motes');
  var colors = ['var(--mint)', 'var(--accent)'];
  for(var i = 0; i < 22; i++){
    var m = document.createElement('div');
    m.className = 'mote';
    var size = 2 + Math.random() * 3;
    m.style.width = size + 'px';
    m.style.height = size + 'px';
    m.style.left = Math.random() * 100 + '%';
    m.style.top = 40 + Math.random() * 60 + '%';
    m.style.background = colors[i % 2];
    m.style.animationDuration = (6 + Math.random() * 8) + 's';
    m.style.animationDelay = (Math.random() * 6) + 's';
    motesEl.appendChild(m);
  }
})();
</script>
</body>
</html>
