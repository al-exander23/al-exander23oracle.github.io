name = "alx-pay"
main = "cloudflare/worker-v2.js"
compatibility_date = "2026-09-13"
keep_vars = true

[assets]
directory = "./pay"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "alx-pay"
database_id = "956ce216-014e-443b-9899-437ab4f44b72"

[vars]
ALX_ALLOWED_ORIGIN = "https://al-exander23.github.io"
ALX_PAY_ORIGIN = "https://alx-pay.alxoracle.workers.dev"
TELEGRAM_CLIENT_ID = "8910147832"

# Production payments use the dedicated live YooKassa credentials below.
# Runtime guards in worker-v2.js fail closed if live credentials are incomplete.
ALX_PAYMENT_MODE = "live"

# Keep tested sandbox values only for rollback/reference. They are ignored in live mode.
YOOKASSA_SHOP_ID = "1464130"
ALX_EXTERNAL_PRICE_RUB = "1"

# Production ALX PRO configuration.
YOOKASSA_LIVE_SHOP_ID = "1462630"
# Temporary live verification price. Restore to 299 after the real payment test.
ALX_LIVE_PRICE_RUB = "29"

# Live Secret Key is intentionally not stored in GitHub:
# YOOKASSA_LIVE_SECRET_KEY -> Cloudflare secret.

[secrets]
required = ["SESSION_SECRET", "TELEGRAM_CLIENT_SECRET", "TELEGRAM_BOT_TOKEN", "YOOKASSA_SECRET_KEY"]
